<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17633f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bridge Quest">
  <title>Bridge Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
  <style>
:root {
  --felt: #17633f;
  --felt-dark: #0f4a2e;
  --felt-light: #1f7a4f;
  --paper: #fffdf7;
  --ink: #1d2433;
  --muted: #5d6677;
  --line: #e3dccb;
  --gold: #f6b93b;
  --gold-dark: #d99a12;
  --good: #1f9d55;
  --good-bg: #e3f7ea;
  --bad: #d64545;
  --bad-bg: #fde8e8;
  --ok: #c98a00;
  --ok-bg: #fff4d6;
  --blue: #2563eb;
  --spade: #1f3f99;
  --heart: #d0191f;
  --diamond: #e46f0a;
  --club: #178a3a;
  --radius: 16px;
  --shadow: 0 6px 20px rgba(0, 0, 0, .18);
  font-size: 17px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: radial-gradient(ellipse at top, var(--felt-light), var(--felt) 45%, var(--felt-dark));
  background-attachment: fixed;
  min-height: 100vh;
}
button { font-family: inherit; font-size: 1rem; cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3 { margin: 0 0 .4em; line-height: 1.2; }

.s-S { color: var(--spade); } .s-H { color: var(--heart); }
.s-D { color: var(--diamond); } .s-C { color: var(--club); }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 22px; color: #fff;
}
.logo { font-weight: 800; font-size: 1.45rem; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.logo .suits { font-size: 1.1rem; background: #fff; border-radius: 10px; padding: 2px 7px; }
.topbar .spacer { flex: 1; }
.chip-btn {
  background: rgba(255, 255, 255, .14); color: #fff; border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 999px; padding: 6px 14px; font-weight: 700;
}
.chip-btn:hover { background: rgba(255, 255, 255, .25); }
.player-chip { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.player-chip .av { font-size: 1.5rem; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 8px 22px 40px; }
.panel {
  background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 26px 30px;
}

/* ---------- home / players ---------- */
.hero { text-align: center; color: #fff; margin: 18px 0 22px; }
.hero h1 { font-size: 2.6rem; text-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
.hero p { font-size: 1.15rem; opacity: .92; margin: 0; }
.player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.player-card {
  background: #fff; border: 3px solid transparent; border-radius: var(--radius); padding: 16px 10px;
  text-align: center; box-shadow: 0 3px 10px rgba(0, 0, 0, .1); transition: transform .12s;
}
.player-card:hover { transform: translateY(-3px); border-color: var(--gold); }
.player-card .av { font-size: 3rem; display: block; }
.player-card .nm { font-weight: 800; font-size: 1.15rem; margin-top: 4px; }
.player-card .sub { color: var(--muted); font-size: .85rem; }
.player-card.new { border: 3px dashed #b9c4b3; background: #f6faf4; color: var(--felt); }
.avatar-pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
.avatar-pick button {
  font-size: 2rem; width: 58px; height: 58px; border-radius: 14px; border: 3px solid #e5e5e5; background: #fff;
}
.avatar-pick button.sel { border-color: var(--gold); background: #fff7e0; }
input[type=text] {
  font-size: 1.2rem; padding: 10px 14px; border-radius: 12px; border: 2px solid #ccd3c6; width: 100%; max-width: 360px;
  font-family: inherit;
}
.btn {
  border: none; border-radius: 14px; padding: 12px 24px; font-weight: 800; font-size: 1.1rem;
  background: var(--gold); color: #3a2a00; box-shadow: 0 4px 0 var(--gold-dark);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
.btn.green { background: #2fbf71; color: #fff; box-shadow: 0 4px 0 #1f8a50; }
.btn.ghost { background: #eef1ea; color: var(--ink); box-shadow: 0 4px 0 #c9cfc2; }
.btn.small { padding: 7px 14px; font-size: .95rem; }
.btn:disabled { opacity: .45; }

/* ---------- lesson map ---------- */
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.lesson-tile {
  background: #fff; border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: center;
  text-align: left; border: 3px solid transparent; box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
}
.lesson-tile:not(:disabled):hover { border-color: var(--gold); transform: translateY(-2px); }
.lesson-tile .ic {
  font-size: 2rem; width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; background: #eaf5ee; flex: none;
}
.lesson-tile.defense .ic { background: #e8eefc; }
.lesson-tile.boss .ic { background: #fdeaea; }
.lesson-tile .tx { flex: 1; min-width: 0; }
.lesson-tile .num { font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.lesson-tile .tt { font-weight: 800; font-size: 1.1rem; }
.lesson-tile .bl { color: var(--muted); font-size: .9rem; }
.lesson-tile .gr { text-align: center; min-width: 58px; }
.grade-badge {
  display: inline-grid; place-items: center; width: 50px; height: 50px; border-radius: 50%;
  font-weight: 900; font-size: 1.35rem; color: #fff; background: #9aa3b2;
}
.grade-A { background: #1f9d55; } .grade-B { background: #2b8ad6; } .grade-C { background: #d99a12; }
.grade-D { background: #e0702a; } .grade-E { background: #9aa3b2; }
.stars { color: var(--gold); font-size: .95rem; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: #d5d9de; }
.soon { opacity: .6; }
.soon .tt::after { content: " · coming soon"; font-weight: 600; color: var(--muted); font-size: .85rem; }
.section-title { color: #fff; font-weight: 800; font-size: 1.2rem; margin: 22px 0 10px; }

/* ---------- lesson runner ---------- */
.lesson-head { display: flex; align-items: center; gap: 14px; color: #fff; margin-bottom: 10px; }
.lesson-head .title { font-weight: 800; font-size: 1.15rem; }
.progress { flex: 1; height: 14px; background: rgba(0, 0, 0, .25); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, #ffd166, #f6b93b); border-radius: 999px; transition: width .35s; }
.streak { font-weight: 800; min-width: 70px; text-align: right; }
.score-pill { background: rgba(0, 0, 0, .25); border-radius: 999px; padding: 4px 12px; font-weight: 800; }

.stage { min-height: 520px; position: relative; }
.stage .panel { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

.q-kicker { font-weight: 800; color: var(--felt); text-transform: uppercase; font-size: .85rem; letter-spacing: .6px; }
.q-kicker.challenge { color: #b4321f; }
.q-text { font-size: 1.3rem; font-weight: 700; margin: 6px 0 14px; }
.teach h2 { font-size: 1.7rem; color: var(--felt-dark); }
.teach p, .teach li { font-size: 1.12rem; line-height: 1.5; }
.teach ul { padding-left: 1.3em; }
.teach .big { font-size: 1.35rem; font-weight: 700; }
.callout {
  background: #fff7e0; border-left: 6px solid var(--gold); padding: 10px 16px; border-radius: 10px; margin: 12px 0; font-size: 1.08rem;
}
.callout.blue { background: #eaf1ff; border-color: var(--blue); }

.owl-row { display: flex; gap: 12px; align-items: flex-start; }
.owl { font-size: 2.6rem; line-height: 1; flex: none; }
.bubble {
  background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; position: relative; font-size: 1.05rem;
}

/* ---------- playing cards ---------- */
.hand { display: flex; align-items: flex-end; padding: 8px 0 4px; flex-wrap: nowrap; }
.hand .grp { display: flex; margin-right: 10px; }
.hand .grp:last-child { margin-right: 0; }
.card {
  width: 62px; height: 88px; border-radius: 9px; background: #fff; border: 1.5px solid #c9c9c9;
  box-shadow: 1px 2px 4px rgba(0, 0, 0, .2); position: relative; flex: none; font-weight: 800;
  user-select: none;
}
.hand .grp .card + .card { margin-left: -30px; }
.card .r { position: absolute; top: 4px; left: 6px; font-size: 1.25rem; line-height: 1; letter-spacing: -1px; }
.card .su { position: absolute; top: 25px; left: 6px; font-size: 1.1rem; line-height: 1; }
.card .mid { position: absolute; right: 6px; bottom: 4px; font-size: 1.9rem; line-height: 1; }
.card.small { width: 46px; height: 64px; border-radius: 7px; }
.card.small .r { font-size: 1rem; top: 3px; left: 4px; }
.card.small .su { font-size: .9rem; top: 20px; left: 4px; }
.card.small .mid { font-size: 1.3rem; right: 4px; bottom: 3px; }
.card.back { background: repeating-linear-gradient(45deg, #c0392b, #c0392b 5px, #a93226 5px, #a93226 10px); border: 3px solid #fff; }
button.card { padding: 0; font-family: inherit; }
button.card.playable:hover { transform: translateY(-10px); box-shadow: 0 8px 14px rgba(0, 0, 0, .25); }
button.card { transition: transform .12s; }
button.card.dim { filter: grayscale(.6) brightness(.85); }
.card.pick-good { outline: 4px solid var(--good); transform: translateY(-10px); }
.card.pick-bad { outline: 4px solid var(--bad); transform: translateY(-10px); }

.hand-box { background: var(--felt); border-radius: 14px; padding: 10px 16px 8px; display: inline-block; max-width: 100%; }
.hand-label { color: #fff; font-weight: 800; font-size: .9rem; margin-bottom: 2px; }
.hand-text { font-family: Consolas, "Courier New", monospace; font-weight: 700; font-size: 1.1rem; line-height: 1.35; }

/* ---------- auction ---------- */
.auction { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 14px; }
.auction .call {
  background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; text-align: center; min-width: 84px;
}
.auction .call .who { font-size: .75rem; color: var(--muted); font-weight: 800; text-transform: uppercase; }
.auction .call .b { font-size: 1.3rem; font-weight: 900; }
.auction .call.you { border-color: var(--gold); background: #fff7e0; }
.auction .arrow { color: var(--muted); font-weight: 900; }

/* ---------- bidding box ---------- */
.bidbox { display: inline-flex; flex-direction: column; gap: 6px; background: #b3261e; padding: 10px; border-radius: 14px; }
.bidbox .row { display: flex; gap: 6px; }
.bidbox button {
  width: 66px; height: 44px; border-radius: 9px; border: none; background: #fff; font-weight: 900; font-size: 1.15rem;
  box-shadow: 0 3px 0 #ccc;
}
.bidbox button:not(:disabled):hover { background: #fff3c4; }
.bidbox button:disabled { opacity: .3; }
.bidbox .pass { width: auto; flex: 1; background: #2fbf71; color: #fff; box-shadow: 0 3px 0 #1f8a50; }
.bidbox .pass:not(:disabled):hover { background: #3fd383; }
.bidbox button.pick-good { outline: 5px solid #7CFC9A; background: var(--good-bg); opacity: 1; transform: scale(1.08); }
.bidbox button.pick-bad { outline: 5px solid #1d2433; background: var(--bad-bg); opacity: 1; }
.bidbox button.show-good { outline: 5px dashed #7CFC9A; background: var(--good-bg); opacity: 1; }
.bidbox .pass.pick-bad, .bidbox .pass.pick-good, .bidbox .pass.show-good { color: var(--ink); }

/* ---------- multiple choice ---------- */
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.choices.wide { grid-template-columns: 1fr; }
.choice {
  text-align: left; background: #fff; border: 3px solid #dfe5da; border-radius: 14px; padding: 12px 16px; font-size: 1.1rem; font-weight: 700;
  box-shadow: 0 3px 0 #dfe5da;
}
.choice:not(:disabled):hover { border-color: var(--gold); }
.choice.good { border-color: var(--good); background: var(--good-bg); }
.choice.bad { border-color: var(--bad); background: var(--bad-bg); }
.choice.okay { border-color: var(--ok); background: var(--ok-bg); }
.choice.reveal { border-color: var(--good); border-style: dashed; }
.choices.yn { grid-template-columns: repeat(2, minmax(160px, 220px)); }
.choices.yn .choice { text-align: center; font-size: 1.3rem; }

/* ---------- feedback ---------- */
.feedback {
  margin-top: 16px; border-radius: 14px; padding: 14px 18px; display: flex; gap: 14px; align-items: flex-start; animation: pop .2s;
}
.feedback.good { background: var(--good-bg); border: 2px solid #9edcb5; }
.feedback.bad { background: var(--bad-bg); border: 2px solid #f1b0b0; }
.feedback.okay { background: var(--ok-bg); border: 2px solid #f0d27a; }
.feedback .fb-ic { font-size: 2.2rem; line-height: 1; }
.feedback .fb-title { font-weight: 900; font-size: 1.2rem; }
.feedback .fb-facts { font-weight: 800; color: var(--felt-dark); margin: 4px 0; }
.feedback .fb-why { font-size: 1.06rem; line-height: 1.45; }
.feedback .fb-body { flex: 1; }
.next-row { display: flex; justify-content: flex-end; margin-top: 14px; gap: 10px; }

.q-layout { display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
.q-layout .left { flex: 1 1 520px; min-width: 0; }
.q-layout .left .hand-box { max-width: none; }
.q-layout .right { flex: 0 0 auto; }

/* guided ladder */
.ladder { margin-top: 6px; }
.rung { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; margin-bottom: 6px; background: #f3f5f0; font-weight: 700; }
.rung .ok { color: var(--good); } .rung .no { color: var(--bad); }
.rung .ans { margin-left: auto; font-weight: 900; }

/* challenge */
.challenge-banner {
  background: linear-gradient(90deg, #7b1fa2, #c2185b); color: #fff; border-radius: 14px; padding: 12px 18px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.15rem;
}
.challenge-banner .ic { font-size: 2rem; }

/* results */
.results { text-align: center; }
.results .big-grade {
  width: 150px; height: 150px; border-radius: 50%; margin: 6px auto 10px; display: grid; place-items: center;
  font-size: 4.5rem; font-weight: 900; color: #fff; box-shadow: 0 6px 0 rgba(0, 0, 0, .15);
}
.results .stars { font-size: 2.6rem; }
.results .rank { font-size: 1.4rem; font-weight: 800; margin: 6px 0; }
.results .line { font-size: 1.15rem; margin: 4px 0; }
.review { text-align: left; margin-top: 20px; }
.review .item { background: #f6f7f3; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
.review .item .q { font-weight: 800; }

/* grown-ups */
table.scores { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.scores th, table.scores td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: center; }
table.scores th { background: #f1efe6; font-size: .8rem; text-transform: uppercase; }
table.scores td.nm { text-align: left; font-weight: 800; white-space: nowrap; }
.mini-grade { display: inline-block; min-width: 30px; padding: 2px 6px; border-radius: 8px; color: #fff; font-weight: 900; }

/* confetti */
.confetti { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

.toast {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 8px 20px;
  font-weight: 900; font-size: 1.2rem; box-shadow: var(--shadow); z-index: 60; animation: pop .2s;
}
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
kbd { background: #eee; border-radius: 5px; padding: 1px 6px; border: 1px solid #ccc; font-size: .85em; }

/* ---------- auction table, contract ---------- */
table.auction4 { border-collapse: separate; border-spacing: 0; background: #fff; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0 0 12px; }
table.auction4 th { background: #f1efe6; padding: 6px 14px; font-size: .85rem; min-width: 84px; }
table.auction4 th div { font-weight: 600; color: var(--muted); font-size: .75rem; }
table.auction4 th.you { background: #fff1c2; }
table.auction4 td { text-align: center; padding: 4px 8px; font-weight: 900; font-size: 1.15rem; height: 32px; }
.contract-badge { display: inline-block; background: #1d2433; color: #fff; border-radius: 10px; padding: 6px 14px; margin: 0 0 10px; font-size: 1.05rem; }
.contract-badge b { background: #fff; color: var(--ink); border-radius: 6px; padding: 0 6px; }
.visual { margin-bottom: 12px; }
.pick-box { margin-top: 4px; }

/* ---------- trick table ---------- */
.trick-table {
  display: grid; grid-template-columns: 150px 130px 150px; grid-template-rows: auto auto auto; gap: 6px; align-items: center; justify-items: center;
  background: var(--felt); border-radius: 18px; padding: 12px; width: max-content; margin: 4px 0 12px;
}
.trick-table .spot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.spot-N { grid-column: 2; grid-row: 1; } .spot-W { grid-column: 1; grid-row: 2; }
.spot-E { grid-column: 3; grid-row: 2; } .spot-S { grid-column: 2; grid-row: 3; }
.spot-mid { grid-column: 2; grid-row: 2; color: #fff; font-size: .95rem; text-align: center; }
.spot-mid b { font-size: 1.3rem; background: #fff; border-radius: 6px; padding: 0 6px; }
.seat-lbl { color: #fff; font-weight: 800; font-size: .85rem; white-space: nowrap; }
.seat-lbl .led { background: var(--gold); color: #3a2a00; border-radius: 6px; padding: 0 5px; font-size: .75rem; }
.card.empty { background: rgba(255, 255, 255, .12); border: 2px dashed rgba(255, 255, 255, .35); box-shadow: none; }
.card.qmark { background: #fff7e0; border: 3px dashed var(--gold); display: grid; place-items: center; font-size: 2rem; color: #b07a00; }

/* ---------- full deal ---------- */
.deal { display: grid; grid-template-columns: repeat(3, minmax(150px, auto)); gap: 8px; align-items: center; justify-items: center; width: max-content; }
.deal .dh { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; }
.deal .dh.you { border-color: var(--gold); background: #fff7e0; }
.deal .dh-lbl { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.dh-N { grid-column: 2; grid-row: 1; } .dh-W { grid-column: 1; grid-row: 2; } .dh-E { grid-column: 3; grid-row: 2; } .dh-S { grid-column: 2; grid-row: 3; }
.dh-mid { grid-column: 2; grid-row: 2; background: var(--felt); color: #fff; border-radius: 12px; width: 110px; height: 80px; display: grid; place-items: center; font-weight: 900; font-size: 1.2rem; text-align: center; }
.dh-mid .s-S, .dh-mid .s-C { background: #fff; border-radius: 4px; padding: 0 3px; }
.reveal { margin-top: 14px; background: #f6f7f3; border-radius: 14px; padding: 12px 16px; }

/* ---------- ladder pop-up ---------- */
.ladder-chip {
  float: right; background: #eef6ff; color: #1d4ed8; border: 2px solid #bfd6ff; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .9rem;
}
.ladder-chip:hover { background: #dbeaff; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 80; display: grid; place-items: center; padding: 20px; animation: pop .15s; }
.modal-box { background: var(--paper); border-radius: 18px; padding: 22px 28px; max-width: 760px; width: 100%; max-height: 90vh; overflow: auto; position: relative; box-shadow: var(--shadow); }
.modal-box h2 { color: var(--felt-dark); }
.modal-x { position: absolute; right: 14px; top: 12px; border: none; background: #eee; border-radius: 50%; width: 34px; height: 34px; font-weight: 900; }
.callout.c-black { border-color: #1d2433; background: #f1f1f1; }
.callout.c-teal { border-color: #3aa5b3; background: #e6f6f8; }
.callout.c-red { border-color: #d64545; background: #fde8e8; }
.callout.c-green { border-color: #1f9d55; background: #e3f7ea; }
.example-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin: 8px 0; }
.example-row .ex { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.example-row .ex .ex-t { font-weight: 800; margin-bottom: 4px; }
/* duplicate MiniBridge */
.free-play.dup-tile { background: linear-gradient(90deg, #efe6ff, #fff); border-color: #7c3aed; margin-top: -8px; }
.free-play.dup-tile .go { color: #6d28d9; }
.dup-btns { margin-top: 14px; gap: 10px; }
.dup-big { font-size: 3rem; font-weight: 900; color: var(--felt); line-height: 1.1; margin-top: 6px; }
.dup-table { width: 100%; }
.dup-table td, .dup-table th { text-align: center; }

/* Bridge Quest - core bridge helpers and the camp's bidding rules.
   Hands are written "spades.hearts.diamonds.clubs" with T for 10 and - for a void,
   e.g. "KJ65.6.K7.AQ7432".  Bids are "1C" "1D" "1H" "1S" "1N" "P".
   The rule functions follow the Jump Start Bridge cheat sheets exactly. */
(function (root) {
  const SUITS = ['S', 'H', 'D', 'C'];
  const SYM = { S: '♠', H: '♥', D: '♦', C: '♣', N: 'NT' };
  const RANKS = 'AKQJT98765432';
  const HCPV = { A: 4, K: 3, Q: 2, J: 1 };

  function parseHand(str) {
    const p = str.split('.');
    if (p.length !== 4) throw new Error('Bad hand: ' + str);
    const h = {};
    SUITS.forEach((s, i) => {
      const cards = p[i] === '-' ? '' : p[i].toUpperCase();
      h[s] = cards.split('').sort((a, b) => RANKS.indexOf(a) - RANKS.indexOf(b)).join('');
    });
    return h;
  }
  const H = (x) => (typeof x === 'string' ? parseHand(x) : x);

  function hcp(hand) {
    const h = H(hand);
    let n = 0;
    SUITS.forEach((s) => { for (const c of h[s]) n += HCPV[c] || 0; });
    return n;
  }
  function lens(hand) {
    const h = H(hand);
    return { S: h.S.length, H: h.H.length, D: h.D.length, C: h.C.length };
  }
  function cardCount(hand) { const L = lens(hand); return L.S + L.H + L.D + L.C; }
  // Balanced = no voids, no singletons, no more than one doubleton
  function isBalanced(hand) {
    const L = Object.values(lens(hand));
    return !L.some((n) => n < 2) && L.filter((n) => n === 2).length <= 1;
  }
  function shapeText(hand) {
    const L = lens(hand);
    return `♠${L.S} ♥${L.H} ♦${L.D} ♣${L.C}`;
  }
  // 5-4-2-2 is borderline.  Camp judgment: OK to treat it as balanced (open 1NT)
  // when BOTH doubletons hold a high card (A, K or Q).
  function isSemiBalancedOK(hand) {
    const h = H(hand), L = lens(hand);
    if (Object.values(L).sort((a, b) => b - a).join('') !== '5422') return false;
    return SUITS.filter((s) => L[s] === 2).every((s) => /[AKQ]/.test(h[s]));
  }
  const isNTShape = (hand) => isBalanced(hand) || isSemiBalancedOK(hand);
  function bidText(b) {
    if (b === 'P') return 'Pass';
    if (b === 'X') return 'Double (X)';
    return b[0] + (b[1] === 'N' ? 'NT' : SYM[b[1]]);
  }
  const STRAIN_ORDER = 'CDHSN';
  function bidRank(b) {
    if (!b || b === 'P' || b === 'X') return -1;
    return (+b[0] - 1) * 5 + STRAIN_ORDER.indexOf(b[1]);
  }

  /* ---------- Opening bid (cheat sheet: "Opening the Bidding") ---------- */
  function openingBid(hand) {
    const p = hcp(hand), L = lens(hand);
    if (p < 12) return 'P';
    if (p > 21 && !(isBalanced(hand) && p >= 25 && p <= 27)) return null; // not covered at camp
    // FIRST, can you open a major?  5+ spades (or 5-5 in both) -> 1S ; 5+ hearts -> 1H
    if (L.S >= 5 && L.S >= L.H) return '1S';
    if (L.H >= 5) return '1H';
    // No 5-card major: balanced (or a 5-4-2-2 with high cards in both doubletons)?
    if (isNTShape(hand)) {
      if (p >= 15 && p <= 17) return '1N';
      if (p >= 20 && p <= 21) return '2N';
      if (p >= 25 && p <= 27) return '3N';
    }
    // Minors: open the longer; 3-3 -> clubs (3 petals); 4-4 or 5-5 -> diamonds (4 sides)
    if (L.C > L.D) return '1C';
    if (L.D > L.C) return '1D';
    return L.D === 3 ? '1C' : '1D';
  }

  /* ---------- Responding to 1C / 1D (cheat sheet, worked top to bottom) ---------- */
  function respondToMinor(hand, opening) {
    const p = hcp(hand), L = lens(hand), m = opening[1];
    if (p < 6) return 'P';
    // 1. Could you have a major fit?  (High Five / 4 on the Floor)
    if (L.S >= 5 && L.S >= L.H) return '1S';
    if (L.H >= 5) return '1H';
    if (L.H >= 4) return '1H';           // 4-4 in the majors -> 1H (4 on the floor)
    if (L.S >= 4) return '1S';
    // 2. No 4-card major - balanced?
    if (isBalanced(hand)) {
      if (p <= 10) return '1N';
      if (p <= 12) return '2N';
      if (p <= 15) return '3N';
      return null;
    }
    // 3. Fit with partner's minor (5+ cards)
    if (L[m] >= 5) {
      if (p <= 9) return '2' + m;
      if (p <= 12) return '3' + m;
      return 'NEW';                      // 13+: bid a new suit
    }
    // 4. Explore the unbid minor
    if (m === 'C' && L.D >= 4) return '1D';
    if (m === 'D' && L.C >= 5 && p >= 10) return '2C';
    // 5. None of the above
    if (p <= 9) return '1N';
    return null;
  }

  /* ---------- Responding to 1H / 1S (cheat sheet, worked top to bottom) ---------- */
  // returns a bid, or 'NEW' meaning "13+ with a fit: bid a new suit first"
  function respondToMajor(hand, opening) {
    const p = hcp(hand), L = lens(hand), M = opening[1];
    if (p < 6) return 'P';
    // 1. Fit with partner's major (3+ cards, since partner has 5+)
    if (L[M] >= 3) {
      if (p <= 9) return '2' + M;
      if (p <= 12) return '3' + M;
      return 'NEW';
    }
    // 2. Explore the unbid major
    if (M === 'H' && L.S >= 4) return '1S';
    if (M === 'S' && L.H >= 5 && p >= 10) return '2H';
    // 3. Balanced
    if (isBalanced(hand)) {
      if (p <= 10) return '1N';
      if (p <= 12) return '2N';
      if (p <= 15) return '3N';
      return null;
    }
    // 4. Minors: 5+ cards and 10+ HCP -> bid at the 2-level
    if (p >= 10 && (L.D >= 5 || L.C >= 5)) return L.D >= L.C ? '2D' : '2C';
    // 5. None of the above
    if (p <= 9) return '1N';
    return null;
  }

  /* ---------- Responding to 1NT: Stayman + Jacoby transfers (standard beginner methods) ---------- */
  function respondTo1NT(hand) {
    const p = hcp(hand), L = lens(hand);
    if (L.H >= 5 || L.S >= 5) return L.H > L.S ? '2D' : '2H';       // transfer (any strength); 5-5 -> spades
    if ((L.H === 4 || L.S === 4) && p >= 8) return '2C';             // Stayman
    if (p <= 7) return 'P';
    if (p <= 9) return '2N';
    if (p <= 15) return '3N';
    return null;
  }
  const staymanAnswer = (hand) => { const L = lens(hand); return L.H >= 4 ? '2H' : L.S >= 4 ? '2S' : '2D'; };
  function afterStayman(hand, ans) {                                 // responder's second bid
    const p = hcp(hand), L = lens(hand);
    const fit = (ans === '2H' && L.H >= 4) || (ans === '2S' && L.S >= 4);
    if (fit) return (p <= 9 ? '3' : '4') + ans[1];
    return p <= 9 ? '2N' : '3N';
  }
  function openerAfterStayman(hand, ans, resp) {                    // opener's last word
    const p = hcp(hand), L = lens(hand), max = p >= 16;
    const spadesToo = ans === '2H' && L.S >= 4;                       // partner has spades if not hearts!
    if (resp === '2N') return spadesToo ? (max ? '4S' : '3S') : (max ? '3N' : 'P');
    if (resp === '3N') return spadesToo ? '4S' : 'P';
    if (resp === '3' + ans[1]) return max ? '4' + ans[1] : 'P';
    return 'P';
  }
  const transferAccept = (bid) => (bid === '2D' ? '2H' : '2S');
  function afterTransfer(hand, M) {                                   // responder's second bid
    const p = hcp(hand), L = lens(hand);
    if (p <= 7) return 'P';
    if (L[M] >= 6) return (p <= 9 ? '3' : '4') + M;
    return p <= 9 ? '2N' : '3N';
  }
  function openerAfterTransfer(hand, M, resp) {
    const p = hcp(hand), L = lens(hand), max = p >= 16, fit = L[M] >= 3;
    if (resp === '3N') return fit ? '4' + M : 'P';
    if (resp === '2N') return fit ? (max ? '4' + M : '3' + M) : (max ? '3N' : 'P');
    if (resp === '3' + M) return max ? '4' + M : 'P';
    return 'P';
  }

  /* ---------- Competitive bidding: overcalls (JumpStart 2, Class 9) ---------- */
  const honorsIn = (cards) => cards.split('').filter((c) => 'AKQJ'.includes(c)).length;
  // a stopper: A, K-x, Q-x-x, or J-x-x-x in that suit
  function hasStopper(hand, s) {
    const c = H(hand)[s];
    return c.includes('A') || (c.includes('K') && c.length >= 2) || (c.includes('Q') && c.length >= 3) || (c.includes('J') && c.length >= 4);
  }
  // the cheapest level at which suit s can be bid over `last` (a bid like '1D')
  const cheapest = (s, last) => { for (let lv = 1; lv <= 7; lv++) if (bidRank(lv + s) > bidRank(last)) return lv; return 8; };
  // 10-5-2: 10+ HCP, 5+ cards, 2 good honors (A K Q J).  A 6-card suit may "stretch" with one honor.
  // opp = suits the opponents have bid; last = the last bid so far (to find the cheapest level)
  function overcallBid(hand, opening, oppSuits, lastBid) {
    const p = hcp(hand), L = lens(hand), h = H(hand), opps = oppSuits || [opening[1]], last = lastBid || opening;
    if (opps.length === 1 && p >= 15 && p <= 18 && isBalanced(hand) && hasStopper(hand, opps[0])) return '1N';
    if (p < 10) return 'P';
    const cands = SUITS.filter((s) => !opps.includes(s) && L[s] >= 5).sort((a, b) => L[b] - L[a] || SUITS.indexOf(a) - SUITS.indexOf(b));
    for (const s of cands) {
      const hon = honorsIn(h[s]);
      if (hon >= 2 || (L[s] >= 6 && hon >= 1)) return cheapest(s, last) + s;
    }
    return 'P';
  }
  /* ---------- Takeout doubles (JumpStart 2, Classes 10-12) ---------- */
  // 1 suit bid: 11+, 3+ in each unbid suit, 0-2 in theirs.  2 suits bid: 11+, 4+ in both unbid suits.
  function takeoutDoubleOK(hand, oppSuits) {
    const p = hcp(hand), L = lens(hand);
    if (p < 11) return false;
    const unbid = SUITS.filter((s) => !oppSuits.includes(s));
    if (oppSuits.length === 1) return L[oppSuits[0]] <= 2 && unbid.every((s) => L[s] >= 3);
    return unbid.every((s) => L[s] >= 4);
  }
  // Overcall or double?  1NT overcall → takeout double → suit overcall → pass
  function competeBid(hand, opening, oppSuits, lastBid) {
    const opps = oppSuits || [opening[1]], p = hcp(hand), L = lens(hand);
    if (opps.length === 1 && p >= 15 && p <= 18 && isBalanced(hand) && hasStopper(hand, opps[0])) return '1N';
    // a good 5-card major overcall comes before a double when you are not short enough to double
    if (takeoutDoubleOK(hand, opps)) return 'X';
    return overcallBid(hand, opening, opps, lastBid);
  }
  // Advancer after partner's takeout double.  free = RHO bid (so advancer is not forced).
  // NOTRUMP needs points: a stopper in each of their suits, no 4-card unbid major, no singleton or void:
  //   7-10 HCP → 1NT · 11-12 → 2NT · 13+ → 3NT.  Never with a weak hand.
  // SUITS: points = HCP + 1 for each card over four in the suit you bid (a 6-card suit adds 2).
  //   0-8 lowest level · 9 judgment · 10-11 jump one level · 12+ game (4 of a 5+ card major, else 'GAME').
  // fit4 = partner's double came after they had bid TWO suits, so partner has 4+ cards in each unbid suit
  function advanceDouble(hand, oppSuits, lastBid, free, fit4) {
    const p = hcp(hand), L = lens(hand);
    if (free && p <= 5) return 'P';
    const ok = SUITS.filter((s) => !oppSuits.includes(s));
    const ntShape = oppSuits.every((s) => hasStopper(hand, s)) && !ok.some((s) => 'HS'.includes(s) && L[s] >= 4) && Math.min(L.S, L.H, L.D, L.C) >= 2;
    if (p >= 7 && ntShape) { const nt = p <= 10 ? '1N' : p <= 12 ? '2N' : '3N'; if (bidRank(nt) > bidRank(lastBid)) return nt; }
    const max = Math.max(...ok.map((s) => L[s]));
    // longest suit; ties → the one you can bid lowest (cheapest level, then lower rank)
    const byLevel = (a, b) => bidRank(cheapest(a, lastBid) + a) - bidRank(cheapest(b, lastBid) + b);
    let s = ok.filter((x) => L[x] === max).sort(byLevel)[0];
    // with 6+ HCP a 4-card major beats a longer minor
    if ('DC'.includes(s) && p >= 6) { const m = ok.filter((x) => 'HS'.includes(x) && L[x] >= 4).sort(byLevel)[0]; if (m) s = m; }
    const pts = p + Math.max(0, L[s] - 4);               // long suits are worth more
    if (pts >= 12) return 'HS'.includes(s) && L[s] >= (fit4 ? 4 : 5) ? '4' + s : 'GAME';
    const lv = cheapest(s, lastBid) + (pts >= 10 ? 1 : 0);
    return lv + s;
  }
  // Cuebid: partner doubled a MINOR, advancer has 12+ and 4+ cards in both majors → bid their suit
  const advancerCuebid = (hand, opening) => 'DC'.includes(opening[1]) && hcp(hand) >= 12 && lens(hand).H >= 4 && lens(hand).S >= 4;
  // Advancer (partner of the overcaller).  ov = partner's overcall, opening = opener's bid
  function advanceOvercall(hand, ov, opening) {
    const p = hcp(hand), L = lens(hand), M = ov[1], opp = opening[1];
    if (p < 6) return 'P';
    const own = SUITS.filter((s) => s !== M && s !== opp && L[s] >= 5).sort((a, b) => L[b] - L[a]);
    // with a minor overcall, show a 5-card major first
    const major = own.find((s) => 'HS'.includes(s));
    if ('DC'.includes(M) && major && L[M] >= 2) { const lv = cheapest(major, ov); if ((lv === 1 && p >= 6) || (lv === 2 && p >= 10)) return lv + major; }
    // FIT (3+ cards) plus good distribution (4+ trumps or a singleton/void) OR strength (A, K or Q) in partner's suit
    const strength = /[AKQ]/.test(H(hand)[M]);
    const shape = L[M] >= 4 || Object.values(L).some((n) => n <= 1);
    if (L[M] >= 3 && (strength || shape)) {
      const lv = +ov[0] + (p <= 9 ? 1 : 2);
      return p <= 12 ? lv + M : 'GAME';
    }
    if (L[M] >= 2) for (const s of own) { const lv = cheapest(s, ov); if ((lv === 1 && p >= 6) || (lv === 2 && p >= 10)) return lv + s; }
    if (hasStopper(hand, opp)) { if (p >= 8 && p <= 10 && bidRank('1N') > bidRank(ov)) return '1N'; if (p >= 11 && p <= 12) return '2N'; }
    return 'P';
  }

  // Overcaller's rebid after advancer bids a NEW suit (forcing): raise with 3+, else 2nd 4+ suit, else own suit again
  function overcallerRebid(hand, opening, ov, adv) {
    const L = lens(hand), A = adv[1], M = ov[1], opp = opening[1];
    if (L[A] >= 3) return cheapest(A, adv) + A;
    const second = SUITS.find((s) => s !== M && s !== A && s !== opp && L[s] >= 4);
    if (second) return cheapest(second, adv) + second;
    return cheapest(M, adv) + M;
  }

  /* ---------- tricks ---------- */
  const SEATS = ['N', 'E', 'S', 'W'];
  const nextSeat = (s, k = 1) => SEATS[(SEATS.indexOf(s) + k) % 4];
  // play = cards in the order played, starting with the leader, e.g. ['D4','D9','DK','D6']
  function trickWinner(leader, play, trump) {
    let best = 0;
    const beats = (a, b) => {           // does card a beat card b?
      if (a[0] === b[0]) return RANKS.indexOf(a[1]) < RANKS.indexOf(b[1]);
      return trump && a[0] === trump;
    };
    for (let i = 1; i < play.length; i++) if (beats(play[i], play[best])) best = i;
    return nextSeat(leader, best);
  }
  const cardName = (c) => SYM[c[0]] + (c[1] === 'T' ? '10' : c[1]);

  const api = { SUITS, SYM, RANKS, SEATS, nextSeat, trickWinner, cardName, parseHand, hcp, lens, cardCount, isBalanced, isSemiBalancedOK, isNTShape, shapeText,
    bidText, bidRank, openingBid, respondToMinor, respondToMajor,
    respondTo1NT, staymanAnswer, afterStayman, openerAfterStayman, transferAccept, afterTransfer, openerAfterTransfer,
    hasStopper, overcallBid, advanceOvercall, honorsIn, overcallerRebid, cheapest,
    takeoutDoubleOK, competeBid, advanceDouble, advancerCuebid };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Bridge = api;
})(this);

/* Bridge Quest - card play engine + computer player ("bot") for MiniBridge and play lessons.
   Cards are 'SA', 'HT', 'D2' ...  Seats N E S W.  Works in the browser and in node (for testing).
   The bot only uses what a real player could see: its own hand, dummy (after the lead), and played cards. */
(function (root) {
  const RANKS = 'AKQJT98765432', SUITS = ['S', 'H', 'D', 'C'], SEATS = ['N', 'E', 'S', 'W'];
  const rv = (r) => 14 - RANKS.indexOf(r);          // A=14 ... 2=2
  const cv = (c) => rv(c[1]);
  const nextSeat = (s, k = 1) => SEATS[(SEATS.indexOf(s) + k) % 4];
  const partnerOf = (s) => nextSeat(s, 2);
  const sideOf = (s) => (s === 'N' || s === 'S' ? 'NS' : 'EW');
  const HCPV = { A: 4, K: 3, Q: 2, J: 1 };

  /* ---------------- play state ---------------- */

      if (T && !inSuit(dHand, s).length && inSuit(dHand, T).length) score -= 8;   // ruff and sluff

  const SUITCLS = { '♠': 's-S', '♥': 's-H', '♦': 's-D', '♣': 's-C' };
  const AVATARS = ['🦊', '🐼', '🐸', '🦁', '🐯', '🐨', '🐙', '🦄', '🐲', '🐧', '🐢', '🦉', '🐬', '🦖', '🐝', '🐱', '🐶', '🐰'];
  const OWL = '🦉';
  const CHEERS = ['Hoot hoot! Nice!', 'You got it!', 'Super!', 'Bridge brain!', 'Exactly right!', 'Owl-standing!', 'Great thinking!'];
  const OOPS = ['Not quite — here is the trick:', 'Good try! Let’s see why:', 'Close! Here is the secret:'];

  /* ---------------- helpers ---------------- */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // colour every suit symbol in authored text
  const fmt = (html) => tapify(html == null ? '' : html).replace(/[♠♥♦♣]/g, (s) => `<span class="${SUITCLS[s]}">${s}</span>`);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const rankText = (r) => (r === 'T' ? '10' : r);
  const SUITSYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
  // phones & tablets: say "tap" instead of "click", and use the phone layout below 700px (see css/mobile.css)
  const TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const isPhone = () => !!(window.matchMedia && window.matchMedia('(max-width: 700px)').matches);
  const TAPWORD = { Click: 'Tap', click: 'tap', Clicking: 'Tapping', clicking: 'tapping' };
  const tapify = (s) => (TOUCH ? String(s).replace(/\b(Click|click|Clicking|clicking)\b/g, (w) => TAPWORD[w]) : s);

  function bidHTML(b) {
    if (b === '?') return '<span style="color:#b07a00">?</span>';
    if (b === 'P') return 'Pass';
    if (b === 'X') return '<span style="color:#c0392b">X</span>';
    if (b[1] === 'N') return b[0] + 'NT';
    return b[0] + `<span class="s-${b[1]}">${SUITSYM[b[1]]}</span>`;
  }
  function cardHTML(rank, suit, opts = {}) {
    const cls = ['card', 's-' + suit];
    if (opts.small) cls.push('small');
    if (opts.extra) cls.push(opts.extra);
    const inner = `<span class="r">${rankText(rank)}</span><span class="su">${SUITSYM[suit]}</span><span class="mid">${SUITSYM[suit]}</span>`;
    if (opts.button) return `<button class="${cls.join(' ')}" data-card="${suit}${rank}" ${opts.disabled ? 'disabled' : ''}>${inner}</button>`;
    return `<div class="${cls.join(' ')}">${inner}</div>`;
  }
  // Suit groups of one hand, split into one or two rows.  On desktop the rows are invisible (display: contents);
  // on a phone each row is a line of cards that squeezes to fit the screen.  groups = [{ n: cards, html }]
  function suitRows(groups) {
    groups = groups.filter((g) => g && g.n);
    const row = (gs) => (gs.length ? `<div class="hrow">${gs.map((g) => g.html).join('')}</div>` : '');
    const total = groups.reduce((a, g) => a + g.n, 0);
    if (groups.length < 2 || total * 34 + groups.length * 18 + (groups.length - 1) * 8 <= 330) return row(groups);
    let best = 1, bestMax = Infinity, run = 0;
    for (let k = 1; k < groups.length; k++) {           // the split that keeps the longer row as short as possible
      run += groups[k - 1].n;
      const m = Math.max(run, total - run);
      if (m < bestMax) { bestMax = m; best = k; }
    }
    return row(groups.slice(0, best)) + row(groups.slice(best));
  }
  function handHTML(hand, opts = {}) {
    const h = typeof hand === 'string' ? B.parseHand(hand) : hand;
    const groups = B.SUITS.map((s) => ({ n: h[s].length, html: '<div class="grp">' + h[s].split('').map((r) => cardHTML(r, s, opts)).join('') + '</div>' }));
    return '<div class="hand">' + suitRows(groups) + '</div>';
  }
  function handBox(hand, label) {
    return `<div class="hand-box">${label ? `<div class="hand-label">${fmt(label)}</div>` : ''}${handHTML(hand)}</div>`;
  }
  function handTextHTML(hand) {
    const h = typeof hand === 'string' ? B.parseHand(hand) : hand;
    return '<div class="hand-text">' + B.SUITS.map((s) =>
      `<div><span class="s-${s}">${SUITSYM[s]}</span> ${h[s] ? h[s].split('').map(rankText).join(' ') : '—'}</div>`).join('') + '</div>';
  }
  function auctionHTML(calls) {
    if (!calls || !calls.length) return '';
    return '<div class="auction">' + calls.map((c, i) =>
      `${i ? '<span class="arrow">→</span>' : ''}<div class="call ${c.b === '?' ? 'you' : ''}"><div class="who">${esc(c.who)}</div><div class="b">${bidHTML(c.b)}</div></div>`
    ).join('') + '</div>';
  }
  function handFacts(hand) {
    return `${B.hcp(hand)} HCP &nbsp;·&nbsp; ${fmt(B.shapeText(hand))} &nbsp;·&nbsp; ${B.isBalanced(hand) ? 'balanced' : 'not balanced'}`;
  }
  const SEATNAME = { N: 'North', E: 'East', S: 'South', W: 'West' };
  const partnerOf = (s) => B.nextSeat(s, 2);
  function roleOf(seat, you) {
    if (!you) return SEATNAME[seat];
    if (seat === you) return 'You';
    if (seat === partnerOf(you)) return 'Partner';
    return 'Opponent';
  }
  const cardText = (c) => fmt(B.cardName(c));
  // Full auction table in W N E S columns.  a = {dealer, calls:[...], you}
  function auction4HTML(a) {
    const cols = ['W', 'N', 'E', 'S'];
    const cells = [];
    for (let i = 0; i < cols.indexOf(a.dealer); i++) cells.push('');
    a.calls.forEach((c) => cells.push(c));
    let rows = '';
    for (let i = 0; i < cells.length; i += 4) {
      rows += '<tr>' + cols.map((_, j) => `<td>${cells[i + j] != null && cells[i + j] !== '' ? bidHTML(cells[i + j]) : ''}</td>`).join('') + '</tr>';
    }
    return `<table class="auction4"><tr>${cols.map((s) => `<th class="${s === a.you ? 'you' : ''}">${SEATNAME[s]}<div>${roleOf(s, a.you)}</div></th>`).join('')}</tr>${rows}</table>`;
  }
  function contractHTML(c, declarer) {
    return `<div class="contract-badge">Contract: <b>${bidHTML(c)}</b>${declarer ? ` &nbsp;by ${SEATNAME[declarer]}` : ''}</div>`;
  }
  // Compass showing the cards played to one trick.  t = {leader, play:[...], trump, you, roles}
  function trickHTML(t, opts = {}) {
    const bySeat = {};
    t.play.forEach((c, i) => { bySeat[B.nextSeat(t.leader, i)] = c; });
    const spot = (s) => {
      const c = bySeat[s];
      const label = `<div class="seat-lbl">${SEATNAME[s]}${t.roles && t.roles[s] ? ` · ${t.roles[s]}` : t.you ? ` · ${roleOf(s, t.you)}` : ''}${s === t.leader ? ' <span class="led">led</span>' : ''}</div>`;
      let inner;
      if (c === 'x') inner = '<div class="card discard">other<br>suit</div>';
      else if (c) inner = opts.clickable ? cardHTML(c[1], c[0], { button: true, extra: 'playable' }) : cardHTML(c[1], c[0]);
      else if (s === t.you && opts.youMark) inner = '<div class="card qmark">?</div>';
      else inner = '<div class="card empty"></div>';
      return `<div class="spot spot-${s}">${s === 'S' ? inner + label : label + inner}</div>`;
    };
    return `<div class="trick-table">
      ${spot('N')}${spot('W')}<div class="spot-mid">${t.trump ? `Trump: <b class="s-${t.trump}">${SUITSYM[t.trump]}</b>` : '<b>Notrump</b>'}</div>${spot('E')}${spot('S')}</div>`;
  }
  // All four hands.  deal = {N,E,S,W}, highlight = seat
  function dealHTML(deal, opts = {}) {
    const box = (s) => `<div class="dh dh-${s} ${s === opts.you ? 'you' : ''}"><div class="dh-lbl">${SEATNAME[s]}${opts.you ? ' · ' + roleOf(s, opts.you) : ''}</div>${handTextHTML(deal[s])}</div>`;
    return `<div class="deal">${box('N')}${box('W')}<div class="dh-mid">${opts.contract ? bidHTML(opts.contract) : ''}${opts.declarer ? `<div>by ${SEATNAME[opts.declarer]}</div>` : ''}</div>${box('E')}${box('S')}</div>`;
  }

  /* ---------------- reference pop-ups (ladders) ---------------- */
  function openModal(html) {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="modal-box"><button class="modal-x" title="Close">✕</button>${fmt(html)}</div>`;
    m.onclick = (e) => { if (e.target === m || e.target.classList.contains('modal-x')) m.remove(); };
    document.body.appendChild(m);
  }
  // in-page "are you sure?" (browser confirm() boxes are blocked when the app runs inside another page or app)
  function askConfirm(msg, yesLabel, onYes) {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="modal-box" style="max-width:420px"><p style="font-size:1.15rem;font-weight:700;margin:4px 0 18px">${esc(msg)}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-no>Cancel</button><button class="btn" data-yes>${esc(yesLabel)}</button></div></div>`;
    m.onclick = (e) => {
      if (e.target === m || e.target.closest('[data-no]')) m.remove();
      else if (e.target.closest('[data-yes]')) { m.remove(); onYes(); }
    };
    document.body.appendChild(m);
  }
  function ladderChip(st) {
    const L = window.BQ_LADDERS && st.ladder && window.BQ_LADDERS[st.ladder];
    return L ? `<button class="ladder-chip" data-ladder="${st.ladder}">🪜 Peek at the ${esc(L.name)}</button>` : '';
  }
  function wireLadder(root) {
    root.querySelectorAll('.ladder-chip').forEach((b) => (b.onclick = () => {
      const L = window.BQ_LADDERS[b.dataset.ladder];
      openModal(`<h2>${L.name}</h2>${L.html}`);
    }));
  }

  /* ---------------- sound ---------------- */
  let actx = null;
  function beep(kind) {
    if (!store.data.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = kind === 'good' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1046] : [220, 180];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = kind === 'bad' ? 'triangle' : 'sine';
        o.frequency.value = f;
        const t = actx.currentTime + i * 0.11;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g).connect(actx.destination);
        o.start(t); o.stop(t + 0.2);
      });
    } catch (e) { /* sound is optional */ }
  }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = fmt(msg);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1600);
  }
  function confetti(n = 40) {
    const syms = ['♠', '♥', '♦', '♣', '⭐'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      const s = pick(syms);
      c.className = 'confetti ' + (SUITCLS[s] || '');
      c.textContent = s;
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
      c.style.animationDelay = Math.random() * 0.8 + 's';
      c.style.fontSize = 18 + Math.random() * 22 + 'px';
      if (s === '⭐') c.style.color = '#f6b93b';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5500);
    }
  }

  /* ---------------- storage ---------------- */
  const KEY = 'bridgequest.v1';
  const store = {
    data: { players: [], currentId: null, sound: true },
    load() {
      try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.players) this.data = Object.assign(this.data, d); } catch (e) { /* fresh start */ }
    },
    save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* storage blocked */ } },
    player() { return this.data.players.find((p) => p.id === this.data.currentId) || null; },
  };

  /* ---------------- shared progress ----------------
     When a results server is set (window.BQ_SERVER in index.html), each player's lesson results are also copied there,
     so the teacher can see everyone's progress from any device on the Grown-ups page. */
  const SERVER = String(window.BQ_SERVER || '').replace(/\/+$/, '');
  let lastSync = '';
  function syncProgress() {
    const p = store.player();
    if (!SERVER || !p || !window.fetch) return;
    if (!Object.keys(p.results || {}).length && !p.mini) return;          // nothing to report yet
    const body = JSON.stringify({ id: p.id, name: p.name, avatar: p.avatar, results: p.results || {}, mini: p.mini || null });
    if (body === lastSync) return;
    fetch(SERVER + '/api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true })
      .then((r) => { if (r.ok) lastSync = body; }).catch(() => { /* offline: it goes up next time */ });
  }

  /* ---------------- grading ---------------- */
  function gradeFor(pct) {
    if (pct >= 90) return 'A';
    if (pct >= 80) return 'B';
    if (pct >= 70) return 'C';
    if (pct >= 60) return 'D';
    return 'F';
  }
  const starsFor = (pct) => (pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 55 ? 1 : 0);
  const RANKNAME = { A: 'Bridge Master!', B: 'Super Star!', C: 'Rising Star!', D: 'Getting There!', F: 'Keep Practicing!' };
  const gradeCls = (g) => 'grade-' + (g === 'F' ? 'E' : g);
  const starsHTML = (n) => '<span class="stars">' + [0, 1, 2].map((i) => (i < n ? '★' : '<span class="off">★</span>')).join('') + '</span>';

  /* ---------------- course ---------------- */
  const LESSONS = window.BQ_LESSONS || {};
  const COURSE = window.BQ_COURSE || [];

  /* ---------------- top bar ---------------- */
  function topbar() {
    const p = store.player();
    return `<div class="topbar">
      <div class="logo"><span class="suits">${fmt('♠♥♦♣')}</span> <span class="name">Bridge Quest</span></div>
      <div class="spacer"></div>
      <button class="chip-btn" id="tb-sound" title="Sound on/off">${store.data.sound ? '🔊' : '🔇'}</button>
      ${p ? `<button class="chip-btn" id="tb-map" title="Lessons">🗺️<span class="lbl"> Lessons</span></button>
      <button class="chip-btn player-chip" id="tb-player"><span class="av">${p.avatar}</span><span class="lbl">${esc(p.name)}</span></button>` : ''}
      <button class="chip-btn" id="tb-grown" title="Grown-ups">👩‍🏫<span class="lbl"> Grown-ups</span></button>
    </div>`;
  }
  function wireTopbar() {
    const s = document.getElementById('tb-sound');
    if (s) s.onclick = () => { store.data.sound = !store.data.sound; store.save(); s.textContent = store.data.sound ? '🔊' : '🔇'; };
    const m = document.getElementById('tb-map'); if (m) m.onclick = () => guardLeave(showMap);
    const p = document.getElementById('tb-player'); if (p) p.onclick = () => guardLeave(showHome);
    const g = document.getElementById('tb-grown'); if (g) g.onclick = () => guardLeave(showGrownupGate);
  }
  let inLesson = false;
  function guardLeave(fn) {
    if (!inLesson) return fn();
    askConfirm('Leave this lesson? Your progress in it will not be saved.', 'Leave', () => { inLesson = false; fn(); });
  }
  function render(html, opts) {
    app.innerHTML = topbar() + html;
    app.classList.toggle('playing', inLesson);   // phones hide the top bar while a lesson or hand is in progress
    wireTopbar();
    if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
  }

  /* ---------------- home: choose player ---------------- */
  function showHome() {
    const ps = store.data.players;
    render(`<div class="wrap">
      <div class="hero"><h1>${OWL} Welcome to Bridge Quest!</h1><p>Who is playing today?</p></div>
      <div class="panel"><div class="player-grid">
        ${ps.map((p) => {
          const done = Object.keys(p.results || {}).length;
          return `<button class="player-card" data-id="${p.id}"><span class="av">${p.avatar}</span><div class="nm">${esc(p.name)}</div><div class="sub">${done} lesson${done === 1 ? '' : 's'} played</div></button>`;
        }).join('')}
        <button class="player-card new" id="new-player"><span class="av">➕</span><div class="nm">New player</div><div class="sub">Make your badge</div></button>
      </div></div></div>`);
    app.querySelectorAll('.player-card[data-id]').forEach((b) => (b.onclick = () => { store.data.currentId = b.dataset.id; store.save(); showMap(); }));
    document.getElementById('new-player').onclick = showNewPlayer;
  }
  function showNewPlayer() {
    let av = pick(AVATARS);
    render(`<div class="wrap"><div class="hero"><h1>Make your player badge</h1></div>
      <div class="panel">
        <h3>1. Type your first name</h3>
        <input type="text" id="np-name" maxlength="16" placeholder="Your name" autocomplete="off">
        <h3 style="margin-top:18px">2. Pick your animal</h3>
        <div class="avatar-pick">${AVATARS.map((a) => `<button data-a="${a}" class="${a === av ? 'sel' : ''}">${a}</button>`).join('')}</div>
        <div class="row"><button class="btn green" id="np-go">Let’s play! ▶</button><button class="btn ghost" id="np-back">Back</button></div>
      </div></div>`);
    const name = document.getElementById('np-name');
    name.focus();
    app.querySelectorAll('.avatar-pick button').forEach((b) => (b.onclick = () => {
      av = b.dataset.a; app.querySelectorAll('.avatar-pick button').forEach((x) => x.classList.toggle('sel', x === b));
    }));
    const go = () => {
      const n = name.value.trim();
      if (!n) { name.focus(); name.style.borderColor = '#d64545'; return; }
      const p = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: n, avatar: av, created: new Date().toISOString(), results: {} };
      store.data.players.push(p); store.data.currentId = p.id; store.save(); showMap();
    };
    document.getElementById('np-go').onclick = go;
    name.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    document.getElementById('np-back').onclick = showHome;
  }

  /* ---------------- lesson map ---------------- */
  function showMap() {
    const p = store.player();
    if (!p) return showHome();
    syncProgress();
    const KIND = { bid: 'Bidding', play: 'Card Play', defense: 'Defense', review: 'Review', boss: 'Final Boss' };
    const tiles = COURSE.map((c, idx) => {
      const L = LESSONS[c.id];
      const isDef = c.kind === 'defense', isBoss = c.kind === 'boss';
      const label = isBoss ? 'Final Boss' : `Lesson ${idx} · ${KIND[c.kind] || ''}`;
      const r = p.results && p.results[c.id];
      const best = r && r.best;
      const gr = best ? `<span class="grade-badge ${gradeCls(best.grade)}">${best.grade}</span><div>${starsHTML(best.stars)}</div>${best.challenge ? '<div title="Challenge solved">🏆</div>' : ''}` : '';
      return (c.section ? `<div class="section-title" style="grid-column:1/-1">${fmt(c.section)}</div>` : '') + `<button class="lesson-tile k-${c.kind} ${isDef ? 'defense' : ''} ${isBoss ? 'boss' : ''} ${L ? '' : 'soon'}" data-id="${c.id}" ${L ? '' : 'disabled'}>
        <div class="ic">${c.icon}</div>
        <div class="tx"><div class="num">${label}</div><div class="tt">${fmt(c.title)}</div><div class="bl">${fmt(c.blurb)}</div></div>
        <div class="gr">${gr}</div></button>`;
    }).join('');
    render(`<div class="wrap">
      <div class="hero"><h1>${p.avatar} ${esc(p.name)}’s Quest Map</h1><p>Pick a lesson. Each one takes about 10–15 minutes and ends with a ⭐ Challenge!</p></div>
      <button class="free-play" id="free-play"><span class="ic">🎲</span><span><b>Free Play: MiniBridge</b><br><span class="bl">Play whole hands against the computer — no bidding, just play!</span></span><span class="go">Play ▶</span></button>
      ${window.BQ_MINI && window.BQ_MINI.hasDuplicate ? '<button class="free-play dup-tile" id="dup-play"><span class="ic">🏆</span><span><b>Duplicate MiniBridge</b><br><span class="bl">Play the same deals as everyone else and see how you compare!</span></span><span class="go">Play ▶</span></button>' : ''}
      <div class="map">${tiles}</div></div>`);
    app.querySelectorAll('.lesson-tile[data-id]').forEach((b) => (b.onclick = () => startLesson(b.dataset.id)));
    document.getElementById('free-play').onclick = () => window.BQ_MINI && window.BQ_MINI.start();
    const dupTile = document.getElementById('dup-play');
    if (dupTile) dupTile.onclick = () => window.BQ_MINI.duplicate();
  }

  /* ---------------- lesson runner ---------------- */
  let R = null; // running lesson state

  function startLesson(id) {
    const L = LESSONS[id];
    if (!L) return;
    R = { L, i: 0, score: 0, max: 0, streak: 0, bestStreak: 0, missed: [], chTotal: 0, chScore: 0, start: Date.now() };
    inLesson = true;
    showStep();
  }
  function headHTML() {
    const pct = Math.round((R.i / R.L.steps.length) * 100);
    return `<div class="lesson-head">
      <button class="chip-btn" id="lh-quit" title="Quit lesson">✕</button>
      <div class="title">${R.L.icon} ${fmt(R.L.title)}</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="score-pill" title="Points so far">✔ ${fmtNum(R.score)}</div>
      <div class="streak" title="Answers in a row">${R.streak >= 2 ? '🔥 ' + R.streak : ''}</div>
    </div>`;
  }
  const fmtNum = (x) => (Math.round(x * 10) / 10).toString();

  function showStep() {
    if (R.i >= R.L.steps.length) return showResults();
    const st = R.L.steps[R.i];
    render(`<div class="wrap">${headHTML()}<div class="stage" id="stage"></div></div>`);
    document.getElementById('lh-quit').onclick = () => guardLeave(showMap);
    const stage = document.getElementById('stage');
    const fn = STEP[st.t];
    if (!fn) throw new Error('Unknown step type ' + st.t);
    fn(st, stage);
  }
  function nextStep() { R.i++; showStep(); }

  // record the result of one scored question.  value: 1 = right, .5 = okay, 0 = wrong
  function record(st, value, qText, rightText) {
    if (st.challenge) {
      R.chTotal += 1; R.chScore += value;
    } else {
      R.max += 1; R.score += value;
    }
    if (value === 1) {
      R.streak++; R.bestStreak = Math.max(R.bestStreak, R.streak);
      if ([3, 5, 8, 12].includes(R.streak)) toast(`🔥 ${R.streak} in a row!`);
      beep('good');
    } else {
      R.streak = 0; beep(value > 0 ? 'good' : 'bad');
      if (!st.challenge) R.missed.push({ q: qText, a: rightText });
    }
    const sp = document.querySelector('.score-pill'); if (sp) sp.textContent = '✔ ' + fmtNum(R.score);
    const sk = document.querySelector('.streak'); if (sk) sk.textContent = R.streak >= 2 ? '🔥 ' + R.streak : '';
  }

  function feedbackHTML(value, facts, why, rightText, titleOverride) {
    const cls = value === 1 ? 'good' : value > 0 ? 'okay' : 'bad';
    const ic = value === 1 ? '🎉' : value > 0 ? '👍' : OWL;
    const title = titleOverride || (value === 1 ? pick(CHEERS) : value > 0 ? 'Good answer — but there’s a better one!' : pick(OOPS));
    return `<div class="feedback ${cls}"><div class="fb-ic">${ic}</div><div class="fb-body">
      <div class="fb-title">${title}</div>
      ${value < 1 && rightText ? `<div class="fb-facts">Best answer: ${fmt(rightText)}</div>` : ''}
      ${facts ? `<div class="fb-facts">${facts}</div>` : ''}
      <div class="fb-why">${fmt(why || '')}</div></div></div>`;
  }
  function addNext(container, label, onNext) {
    const row = document.createElement('div');
    row.className = 'next-row';
    row.innerHTML = `<button class="btn green" id="next-btn">${label || 'Next ▶'}</button>`;
    container.appendChild(row);
    const btn = row.querySelector('#next-btn');
    btn.onclick = () => { document.onkeydown = null; onNext(); };
    btn.focus({ preventScroll: true });
    const fbs = container.querySelectorAll('.feedback');
    const fbEl = fbs[fbs.length - 1];
    if (isPhone()) {
      // phone: show the explanation and the Next button together if they fit; otherwise start at the top of the
      // explanation so it gets read.  Teaching pages don't scroll at all — you read down to the button.
      if (fbEl) {
        const fits = row.getBoundingClientRect().bottom - fbEl.getBoundingClientRect().top < window.innerHeight - 24;
        (fits ? row : fbEl).scrollIntoView({ behavior: 'smooth', block: fits ? 'nearest' : 'start' });
      }
    } else btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } };
  }
  function kickerHTML(st) {
    if (st.challenge) {
      return `<div class="challenge-banner"><span class="ic">⭐</span><div>CHALLENGE PROBLEM<div style="font-weight:600;font-size:.95rem">${fmt(st.challengeNote || 'This one goes past what the lesson taught. Think it through — it won’t hurt your grade!')}</div></div></div>`;
    }
    return st.kicker ? `<div class="q-kicker">${fmt(st.kicker)}</div>` : '';
  }
  // the left-side "visual" of a question: contract, auction, trick, hand, diagram
  function visualHTML(st) {
    let v = '';
    if (st.contract) v += contractHTML(st.contract, st.declarer);
    if (st.auction4) v += auction4HTML(st.auction4);
    if (st.auction) v += auctionHTML(st.auction);
    if (st.trick && st.t !== 'trick') v += trickHTML(st.trick, { youMark: true });
    if (st.dummyCards) v += '<div style="margin-bottom:10px">' + handBox(st.dummyCards, st.dummyLabel || 'Dummy') + '</div>';
    if (st.hand && !['lead', 'pickcard'].includes(st.t)) v += handBox(st.hand, st.handLabel || 'Your hand');
    if (st.diagram) v += st.diagram;
    return v;
  }

  const STEP = {};

  /* --- teach card --- */
  STEP.teach = (st, stage) => {
    stage.innerHTML = `<div class="panel teach">
      ${st.kicker ? `<div class="q-kicker">${fmt(st.kicker)}</div>` : ''}
      <h2>${fmt(st.title)}</h2>
      ${st.owl ? `<div class="owl-row" style="margin-bottom:10px"><div class="owl">${OWL}</div><div class="bubble">${fmt(st.owl)}</div></div>` : ''}
      <div>${fmt(st.html)}</div>
      ${st.hand ? `<div style="margin-top:10px">${handBox(st.hand, st.handLabel)}</div>` : ''}
      ${st.cards ? `<div style="margin-top:10px">${handBox(st.cards, st.handLabel)}</div>` : ''}
      ${st.trick ? `<div style="margin-top:10px">${trickHTML(st.trick)}</div>` : ''}
      ${st.deal ? `<div style="margin-top:10px">${dealHTML(st.deal, st.dealOpts || {})}</div>` : ''}
      ${st.html2 ? `<div style="margin-top:10px">${fmt(st.html2)}</div>` : ''}
    </div>`;
    addNext(stage.firstElementChild, st.button || 'Got it! ▶', nextStep);
  };

  /* --- multiple choice --- */
  STEP.mc = (st, stage) => {
    const layout = st.layout === 'yn' ? 'yn' : st.layout === 'wide' ? 'wide' : '';
    stage.innerHTML = `<div class="panel">${kickerHTML(st)}${ladderChip(st)}
      <div class="q-text">${fmt(st.q)}</div>
      <div style="margin-bottom:14px">${visualHTML(st)}</div>
      <div class="choices ${layout}">${st.choices.map((c, i) => `<button class="choice" data-i="${i}">${fmt(c)}</button>`).join('')}</div>
      <div id="fb"></div></div>`;
    const panel = stage.firstElementChild;
    wireLadder(panel);
    panel.querySelectorAll('.choice').forEach((b) => (b.onclick = () => {
      const i = +b.dataset.i;
      const value = i === st.a ? 1 : (st.ok || []).includes(i) ? 0.5 : 0;
      panel.querySelectorAll('.choice').forEach((x) => {
        x.disabled = true;
        const j = +x.dataset.i;
        if (j === i) x.classList.add(value === 1 ? 'good' : value > 0 ? 'okay' : 'bad');
        else if (j === st.a) x.classList.add('reveal');
      });
      record(st, value, st.q, st.choices[st.a]);
      const facts = st.hand && st.facts !== false ? handFacts(st.hand) : '';
      const why = (value < 1 && st.whyWrong && st.whyWrong[i]) ? st.whyWrong[i] + ' ' + st.why : st.why;
      panel.querySelector('#fb').innerHTML = feedbackHTML(value, facts, why, value < 1 ? st.choices[st.a] : '');
      addNext(panel, null, nextStep);
    }));
  };

  /* --- bidding box --- */
  function bidboxHTML(levels, above, dbl) {
    let h = '<div class="bidbox">';
    for (let lv = 1; lv <= levels; lv++) {
      h += '<div class="row">' + 'CDHSN'.split('').map((s) => {
        const b = lv + s;
        return `<button data-b="${b}" ${B.bidRank(b) <= above ? 'disabled' : ''}>${bidHTML(b)}</button>`;
      }).join('') + '</div>';
    }
    return h + '<div class="row"><button class="pass" data-b="P">Pass</button>' + (dbl ? '<button class="dbl" data-b="X"><b class="x">X</b> Double</button>' : '') + '</div></div>';
  }
  STEP.bid = (st, stage) => {
    const above = Math.max(-1, ...(st.auction || []).map((c) => B.bidRank(c.b)));
    stage.innerHTML = `<div class="panel">${kickerHTML(st)}${ladderChip(st)}
      <div class="q-text">${fmt(st.q || 'What do you bid?')}</div>
      <div class="q-layout"><div class="left">${visualHTML(st)}</div>
      <div class="right">${bidboxHTML(st.levels || 3, above, st.dbl)}</div></div>
      <div id="fb"></div></div>`;
    const panel = stage.firstElementChild;
    wireLadder(panel);
    panel.querySelectorAll('.bidbox button').forEach((b) => (b.onclick = () => {
      const bid = b.dataset.b;
      const value = bid === st.a ? 1 : (st.ok || []).includes(bid) ? 0.5 : 0;
      panel.querySelectorAll('.bidbox button').forEach((x) => {
        x.disabled = true;
        if (x === b) x.classList.add(value === 1 ? 'pick-good' : 'pick-bad');
        else if (x.dataset.b === st.a) { x.classList.add('show-good'); x.disabled = false; x.style.pointerEvents = 'none'; }
      });
      const right = B.bidText(st.a);
      record(st, value, (st.qShort || st.q || 'What do you bid?') + (st.hand ? ` (${handPlain(st.hand)})` : ''), right);
      const why = (value < 1 && st.whyWrong && st.whyWrong[bid]) ? st.whyWrong[bid] + ' ' + st.why : st.why;
      panel.querySelector('#fb').innerHTML = feedbackHTML(value, st.hand && st.facts !== false ? handFacts(st.hand) : '', why, value < 1 ? right : '');
      addNext(panel, null, nextStep);
    }));
  };
  function handPlain(hand) {
    const h = B.parseHand(hand);
    return B.SUITS.map((s) => SUITSYM[s] + (h[s] ? h[s].replace(/T/g, '10') : '—')).join(' ');
  }

  /* --- guided walk-through: several small questions about one hand --- */
  STEP.guided = (st, stage) => {
    let k = 0;
    stage.innerHTML = `<div class="panel">${kickerHTML(st)}${ladderChip(st)}
      <div class="q-text">${fmt(st.q)}</div>
      <div class="q-layout"><div class="left">${visualHTML(st)}<div class="ladder" id="ladder"></div></div></div>
      <div id="part"></div></div>`;
    const panel = stage.firstElementChild;
    wireLadder(panel);
    const ladder = panel.querySelector('#ladder');
    const partBox = panel.querySelector('#part');
    function showPart() {
      const pt = st.parts[k];
      const isBid = !!pt.bid;
      partBox.innerHTML = `<div class="q-text" style="font-size:1.15rem;margin-top:14px">${fmt(pt.q)}</div>
        ${isBid ? bidboxHTML(st.levels || 3, Math.max(-1, ...(st.auction || []).map((c) => B.bidRank(c.b))), st.dbl)
          : `<div class="choices ${pt.layout || (pt.choices.length === 2 ? 'yn' : '')}">${pt.choices.map((c, i) => `<button class="choice" data-i="${i}">${fmt(c)}</button>`).join('')}</div>`}
        <div id="pfb"></div>`;
      const btns = partBox.querySelectorAll(isBid ? '.bidbox button' : '.choice');
      btns.forEach((b) => (b.onclick = () => {
        let value, rightText, chosenText;
        if (isBid) {
          value = b.dataset.b === pt.a ? 1 : (pt.ok || []).includes(b.dataset.b) ? 0.5 : 0;
          rightText = B.bidText(pt.a); chosenText = B.bidText(b.dataset.b);
          btns.forEach((x) => { x.disabled = true; if (x === b) x.classList.add(value === 1 ? 'pick-good' : 'pick-bad'); else if (x.dataset.b === pt.a) x.classList.add('show-good'); });
        } else {
          const i = +b.dataset.i;
          value = i === pt.a ? 1 : 0;
          rightText = pt.choices[pt.a]; chosenText = pt.choices[i];
          btns.forEach((x) => { x.disabled = true; const j = +x.dataset.i; if (j === i) x.classList.add(value ? 'good' : 'bad'); else if (j === pt.a) x.classList.add('reveal'); });
        }
        record(st, value, `${st.q} — ${pt.q} (${handPlain(st.hand)})`, rightText);
        partBox.querySelector('#pfb').innerHTML = feedbackHTML(value, '', pt.why, value < 1 ? rightText : '');
        const last = k === st.parts.length - 1;
        addNext(partBox, last ? 'Next ▶' : 'Next step ▶', () => {
          ladder.insertAdjacentHTML('beforeend', `<div class="rung"><span class="${value ? 'ok' : 'no'}">${value ? '✔' : '✘'}</span>${fmt(pt.short || pt.q)}<span class="ans">${fmt(rightText)}</span></div>`);
          k++;
          if (last) nextStep(); else showPart();
        });
      }));
    }
    showPart();
  };

  /* --- pick a card from your hand (opening leads, following suit, defense) --- */
  function cardPickStep(st, stage, isLead) {
    const answers = [].concat(st.a);
    const src = st.hand || st.cards;
    const label = st.pickLabel || (isLead ? `Your hand${st.you ? ' (' + SEATNAME[st.you] + ')' : ''} — ${TOUCH ? 'tap' : 'click'} the card you lead` : `Your cards — ${TOUCH ? 'tap' : 'click'} the one you play`);
    stage.innerHTML = `<div class="panel">${kickerHTML(st)}${ladderChip(st)}
      <div class="q-text">${fmt(st.q || (isLead ? 'What is your opening lead?' : 'Which card do you play?'))}</div>
      <div class="visual">${visualHTML(st)}</div>
      <div class="hand-box pick-box"><div class="hand-label">${fmt(label)}</div>${handHTML(src, { button: true, extra: 'playable' })}</div>
      <div id="fb"></div></div>`;
    const panel = stage.firstElementChild;
    wireLadder(panel);
    const btns = panel.querySelectorAll('.pick-box button.card');
    btns.forEach((b) => (b.onclick = () => {
      const card = b.dataset.card;
      const sameSuit = answers.some((a) => a[0] === card[0]);
      let value = answers.includes(card) ? 1 : (st.ok || []).includes(card) ? 0.5 : (isLead && st.suitHalf !== false && sameSuit) ? 0.5 : 0;
      let title = null;
      if (value === 0.5 && sameSuit && !(st.ok || []).includes(card)) title = 'Right suit! But a different card is best.';
      btns.forEach((x) => {
        x.disabled = true; x.classList.remove('playable');
        if (x === b) x.classList.add(value === 1 ? 'pick-good' : 'pick-bad');
        else if (answers.includes(x.dataset.card)) x.classList.add('pick-good');
        else x.classList.add('dim');
      });
      const right = answers.map(cardText).join(' or ');
      record(st, value, `${st.qShort || st.q || 'Opening lead'}${st.hand ? ` (${handPlain(st.hand)})` : ''}`, right);
      const why = (value < 1 && st.whyWrong && st.whyWrong[card]) ? st.whyWrong[card] + ' ' + st.why : st.why;
      let fb = feedbackHTML(value, '', why, value < 1 ? right : '', title);
      if (st.deal) {
        fb += `<div class="reveal"><div class="q-kicker">👀 Here are all four hands</div>${dealHTML(st.deal, { you: st.you, contract: st.contract, declarer: st.declarer })}
          ${st.dealNote ? `<div class="fb-why" style="margin-top:8px">${fmt(st.dealNote)}</div>` : ''}</div>`;
      }
      panel.querySelector('#fb').innerHTML = fb;
      addNext(panel, null, nextStep);
    }));
  }
  STEP.lead = (st, stage) => cardPickStep(st, stage, true);
  STEP.pickcard = (st, stage) => cardPickStep(st, stage, false);

  /* --- which card wins this trick? (click it) --- */
  STEP.trick = (st, stage) => {
    const t = st.trick;
    const winner = st.a || B.trickWinner(t.leader, t.play, t.trump);
    stage.innerHTML = `<div class="panel">${kickerHTML(st)}
      <div class="q-text">${fmt(st.q || 'Which card wins this trick? Click it.')}</div>
      ${trickHTML(t, { clickable: true })}
      <div id="fb"></div></div>`;
    const panel = stage.firstElementChild;
    const btns = panel.querySelectorAll('.trick-table button.card');
    const seatOf = (card) => B.nextSeat(t.leader, t.play.indexOf(card));
    btns.forEach((b) => (b.onclick = () => {
      const seat = seatOf(b.dataset.card);
      const value = seat === winner ? 1 : 0;
      btns.forEach((x) => {
        x.disabled = true; x.classList.remove('playable');
        if (x === b) x.classList.add(value ? 'pick-good' : 'pick-bad');
        else if (seatOf(x.dataset.card) === winner) x.classList.add('pick-good');
      });
      const wc = t.play[(B.SEATS.indexOf(winner) - B.SEATS.indexOf(t.leader) + 4) % 4];
      record(st, value, st.q || 'Which card wins the trick?', `${cardText(wc)} (${SEATNAME[winner]})`);
      panel.querySelector('#fb').innerHTML = feedbackHTML(value, '', st.why, value ? '' : `${cardText(wc)} — ${SEATNAME[winner]} wins`);
      addNext(panel, null, nextStep);
    }));
  };

  /* --- play out a suit: the kid plays both North (dummy) and South (declarer); the computer defends (notrump).
     st = { suit, N, S, W, E (ranks, e.g. 'AQJ52'), lead:'S', goal,
            side: { suit:'C', N:'A', S:'2', W:'K', E:'Q' }   optional side suit (an entry): ♣A in North, ♣2 in South
            solution: ['HA','H5', …] card ids, used by the tests } --- */
  STEP.suitplay = (st, stage) => {
    const suit = st.suit || 'S', sym = SUITSYM[suit];
    const R = B.RANKS, rv = (c) => 13 - R.indexOf(c[1]);       // bigger = higher
    const side = st.side || null;
    let scored = false;
    function start() {
      const H = {};
      ['N', 'E', 'S', 'W'].forEach((s) => {
        const main = (st[s] || '').split('').map((r) => suit + r);
        const sd = side && side[s] ? side[s].split('').map((r) => side.suit + r) : [];
        H[s] = [...main, ...sd].sort((a, b) => (a[0] === b[0] ? R.indexOf(a[1]) - R.indexOf(b[1]) : a[0] === suit ? -1 : 1));
      });
      const G = { H, leader: st.lead || 'S', won: 0, lost: 0, cur: [], log: [], over: false, busy: false };
      stage.innerHTML = `<div class="panel">${kickerHTML(st)}
        <div class="q-text">${fmt(st.q || `Take ${st.goal} ${sym} tricks.`)}</div>
        <div class="sp-wrap"><div id="sp-table"></div><div class="sp-side" id="sp-side"></div></div>
        <div id="fb"></div></div>`;
      const panel = stage.firstElementChild;
      const sideBox = panel.querySelector('#sp-side');
      const turnSeat = () => B.nextSeat(G.leader, G.cur.length);
      const ledSuit = () => (G.cur.length && G.cur[0].c !== 'x' ? G.cur[0].c[0] : null);
      const legal = (seat) => {
        const h = G.H[seat], ls = ledSuit();
        if (!ls) return h.slice();
        return h.filter((c) => c[0] === ls);                   // empty = must throw a card from another suit
      };
      const mainLeft = (seat) => G.H[seat].filter((c) => c[0] === suit).length;
      const handRow = (seat) => {
        const mine = G.cur.length < 4 && turnSeat() === seat && !G.over && !G.busy;
        const ok = mine ? legal(seat) : [];
        const groups = suitRows([suit, side && side.suit].filter(Boolean).map((s) => {
          const cs = G.H[seat].filter((c) => c[0] === s);
          return { n: cs.length, html: '<div class="grp">' + cs.map((c) => cardHTML(c[1], c[0], { button: true, extra: ok.includes(c) ? 'playable' : 'dim', disabled: !ok.includes(c) })).join('') + '</div>' };
        }));
        return `<div class="sp-hand ${mine ? 'turn' : ''}"><div class="hand-label">${seat === 'N' ? 'North · Dummy' : 'South · You'}${mine ? ' — your turn!' : ''}</div>
          <div class="hand">${groups || '<span class="muted" style="color:#fff">no cards left</span>'}</div></div>`;
      };
      function draw() {
        const t = { leader: G.leader, play: G.cur.map((x) => x.c), trump: null,
          roles: st.hideCounts ? { W: '?', E: '?' } : { W: `${G.H.W.filter((c) => c[0] === suit).length} ${sym} left`, E: `${G.H.E.filter((c) => c[0] === suit).length} ${sym} left` } };
        panel.querySelector('#sp-table').innerHTML = handRow('N') + trickHTML(t) + handRow('S');
        sideBox.innerHTML = `<div class="sp-score">${sym} tricks won: <b>${G.won}</b> / goal ${st.goal}</div>
          ${side ? `<div class="muted" style="margin-bottom:6px">The ${SUITSYM[side.suit]} cards are your <b>entry</b> — a way to get from one hand to the other. Use it at the right moment!</div>` : ''}
          <div class="sp-log">${G.log.map((l) => `<div>${fmt(l)}</div>`).join('')}</div>`;
        panel.querySelectorAll('.sp-hand button.card').forEach((b) => (b.onclick = () => playCard(turnSeat(), b.dataset.card)));
      }
      function defenderPick(seat) {
        const ls = ledSuit();
        const cs = G.H[seat].filter((c) => c[0] === (ls || suit));
        if (!cs.length) return ls ? 'x' : (G.H[seat][0] || 'x');
        if (G.cur.length >= 2) {
          // third or fourth hand: win as cheaply as possible if declarer's side is winning
          const best = G.cur.filter((x) => x.c !== 'x' && x.c[0] === ls).sort((a, b) => rv(b.c) - rv(a.c))[0];
          if (best && (best.seat === 'N' || best.seat === 'S')) {
            const over = cs.filter((c) => rv(c) > rv(best.c));
            if (over.length) return over[over.length - 1];
          }
        }
        return cs[cs.length - 1];                              // second hand low
      }
      function playCard(seat, c) {
        if (G.busy || G.over) return;
        if (c !== 'x') G.H[seat].splice(G.H[seat].indexOf(c), 1);
        G.cur.push({ seat, c });
        step();
      }
      function finishTrick() {
        const ls = G.cur[0].c[0];
        const w = G.cur.filter((x) => x.c !== 'x' && x.c[0] === ls).sort((a, b) => rv(b.c) - rv(a.c))[0];
        const ours = w.seat === 'N' || w.seat === 'S';
        if (ls === suit) { if (ours) G.won++; else G.lost++; }
        G.log.push(`${ours ? '✅' : '❌'} ${SUITSYM[ls]}${rankText(w.c[1])} from ${SEATNAME[w.seat]} wins${ls !== suit ? ` — now you are in ${SEATNAME[w.seat]}` : ''}.`);
        G.leader = w.seat;
        G.cur = [];
      }
      function step() {
        if (G.cur.length === 4) {
          G.busy = true; draw();
          setTimeout(() => { G.busy = false; finishTrick(); step(); }, 900);
          return;
        }
        if (G.cur.length === 0) {
          if (!mainLeft('N') && !mainLeft('S')) return end();
          if (G.leader === 'E' || G.leader === 'W') {
            if (!G.H[G.leader].length) { G.log.push('The defenders switch to another suit. You win it in the South hand.'); G.leader = 'S'; return step(); }
          } else if (!mainLeft(G.leader) && !(side && G.H[G.leader].some((c) => c[0] === side.suit))) {
            return end(true);                                  // stuck: nothing useful left to lead from this hand
          }
        }
        const seat = turnSeat();
        if (seat === 'E' || seat === 'W') {
          G.busy = true; draw();
          setTimeout(() => { G.busy = false; const c = defenderPick(seat); if (c !== 'x') G.H[seat].splice(G.H[seat].indexOf(c), 1); G.cur.push({ seat, c }); step(); }, 450);
          return;
        }
        if (G.cur.length && !legal(seat).length) {
          G.cur.push({ seat, c: 'x' });
          G.log.push(`${SEATNAME[seat]} has no ${SUITSYM[ledSuit()]} and throws a card from another suit.`);
          return step();
        }
        draw();
      }
      function end(stuck) {
        G.over = true; draw();
        const value = G.won >= st.goal ? 1 : 0;
        if (!scored) { record(st, value, st.qShort || `Take ${st.goal} tricks with ${sym}${st.N} opposite ${sym}${st.S}`, st.plan || ''); scored = true; }
        const other = G.leader === 'N' ? 'S' : 'N';
        const stranded = G.H[other] ? G.H[other].filter((c) => c[0] === suit) : [];
        const stuckMsg = stuck && stranded.length ? `<div class="fb-facts">🚧 Stuck in the ${SEATNAME[G.leader]} hand! The ${stranded.map((c) => sym + rankText(c[1])).join(' ')} in ${SEATNAME[other]} could not be reached.</div>` : '';
        const title = value ? `You took ${G.won} tricks — goal reached! 🎉` : `You took ${G.won} trick${G.won === 1 ? '' : 's'}. The goal was ${st.goal}.`;
        panel.querySelector('#fb').innerHTML = feedbackHTML(value, '', stuckMsg + fmt(st.why), value ? '' : st.plan, title) +
