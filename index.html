          `<div class="reveal"><div class="q-kicker">👀 The opponents had</div><div class="hand-text">West: ${sym} ${(st.W || '—').split('').map(rankText).join(' ')} &nbsp;&nbsp; East: ${sym} ${(st.E || '—').split('').map(rankText).join(' ')}</div></div>`;
        addNext(panel, null, nextStep);
        const row = panel.querySelector('.next-row');
        const again = document.createElement('button');
        again.className = 'btn ghost'; again.textContent = '🔁 Play it again (practice)';
        again.onclick = () => { document.onkeydown = null; start(); };
        row.insertBefore(again, row.firstChild);
      }
      step();
    }
    start();
  };

  /* --- play out a small real deal: kid plays North (dummy) + South (declarer), the computer defends with the bot.
     st = { hands:{N,E,S,W} ('AK.-.Q2.5' style, same number of cards each), trump:'S'|null, lead:'S', goal, solution, plan, why } --- */
  STEP.dealplay = (st, stage) => {
    const PL = window.Play;
    let scored = false;
    function start() {
      const toCards = (h) => { const p = B.parseHand(h); return B.SUITS.flatMap((s) => p[s].split('').map((r) => s + r)); };
      const hands = {}; ['N', 'E', 'S', 'W'].forEach((s) => (hands[s] = PL.sortHand(toCards(st.hands[s]))));
      const con = st.contract ? { level: +st.contract[0], strain: st.contract[1] } : { level: 1, strain: st.trump || 'N' };
      const g = PL.newPlay(hands, con, st.declarer || 'S');
      let hint = null;
      g.leader = st.lead || 'S'; g.dummyVisible = true;
      const inPlay = new Set(Object.values(hands).flat());
      PL.SUITS.forEach((s) => PL.RANKS.split('').forEach((r) => { if (!inPlay.has(s + r)) g.played.push(s + r); }));
      const total = hands.N.length;
      let busy = false, last = null;
      const log = [];
      stage.innerHTML = `<div class="panel">${kickerHTML(st)}
        <div class="q-text">${fmt(st.q)}</div>
        <div class="sp-wrap"><div id="dp-table"></div><div class="sp-side" id="dp-side"></div></div>
        <div id="fb"></div></div>`;
      const panel = stage.firstElementChild;
      const row = (seat) => {
        const turn = !busy && g.history.length < total && PL.turnOf(g) === seat;
        const legal = turn ? PL.legalCards(g, seat) : [];
        const groups = suitRows(PL.SUITS.map((s) => {
          const cs = PL.inSuit(g.hands[seat], s);
          return { n: cs.length, html: '<div class="grp">' + cs.map((c) => cardHTML(c[1], c[0], { button: true, extra: (legal.includes(c) ? 'playable' : 'dim') + (hint === c ? ' hint' : ''), disabled: !legal.includes(c) })).join('') + '</div>' };
        }));
        const role = seat === (st.declarer || 'S') ? 'Declarer · You' : 'Dummy · you play it';
        return `<div class="sp-hand ${turn ? 'turn' : ''}"><div class="hand-label">${SEATNAME[seat]} · ${role}${turn ? ' — your turn!' : ''}</div>
          <div class="hand">${groups || '<span style="color:#fff">no cards left</span>'}</div></div>`;
      };
      function draw() {
        const t = g.trick.length ? g.trick : (last || []);
        const tt = { leader: t.length ? t[0].seat : g.leader, play: t.map((x) => x.card), trump: st.trump || null,
          roles: { W: `${g.hands.W.length} cards`, E: `${g.hands.E.length} cards` } };
        panel.querySelector('#dp-table').innerHTML = row('N') + trickHTML(tt) + row('S');
        const kidTurn = !busy && g.history.length < total && ['N', 'S'].includes(PL.turnOf(g));
        panel.querySelector('#dp-side').innerHTML = `${st.contract ? `<div class="contract-badge">Contract: <b>${bidHTML(st.contract)}</b> by ${SEATNAME[st.declarer || 'S']}</div>` : ''}
          <div class="sp-score">Tricks won: <b>${g.tricks.NS}</b> / goal ${st.goal}</div>
          ${kidTurn && st.hint !== false ? '<button class="btn small" id="dp-hint">🦉 Hint</button>' : ''}
          <div class="muted" style="margin-bottom:6px">${st.trump ? `Trumps are <b class="s-${st.trump}">${SUITSYM[st.trump]}</b>.` : 'Notrump.'} The computer plays East and West.</div>
          <div class="sp-log">${log.map((l) => `<div>${fmt(l)}</div>`).join('')}</div>`;
        panel.querySelectorAll('.sp-hand button.card.playable').forEach((b) => (b.onclick = () => { hint = null; play(PL.turnOf(g), b.dataset.card); }));
        const hb = panel.querySelector('#dp-hint');
        if (hb) hb.onclick = () => { hint = PL.botPlay(g, PL.turnOf(g)); draw(); };
      }
      function play(seat, card) {
        if (busy) return;
        const before = g.trick.slice();
        const w = PL.playCard(g, seat, card);
        if (w) {
          last = [...before, { seat, card }];
          const ours = w === 'N' || w === 'S';
          const wc = last.find((x) => x.seat === w).card;
          log.push(`${ours ? '✅' : '❌'} Trick ${g.history.length}: ${cardText(wc)} from ${SEATNAME[w]} wins.`);
          busy = true; draw();
          setTimeout(() => { busy = false; last = null; loop(); }, 950);
        } else loop();
      }
      function loop() {
        if (g.history.length === total) return end();
        const seat = PL.turnOf(g);
        if (seat === 'N' || seat === 'S') { draw(); return; }
        busy = true; draw();
        setTimeout(() => { busy = false; play(seat, PL.botPlay(g, seat)); }, 550);
      }
      function end() {
        draw();
        const value = g.tricks.NS >= st.goal ? 1 : 0;
        if (!scored) { record(st, value, st.qShort || st.q, st.plan || ''); scored = true; }
        const title = value ? `You took ${g.tricks.NS} tricks — goal reached! 🎉` : `You took ${g.tricks.NS} of ${total} tricks. The goal was ${st.goal}.`;
        panel.querySelector('#fb').innerHTML = feedbackHTML(value, '', st.why, value ? '' : st.plan, title) +
          `<div class="reveal"><div class="q-kicker">👀 All four hands at the start</div>${dealHTML(st.hands, { you: 'S' })}</div>`;
        addNext(panel, null, nextStep);
        const r = panel.querySelector('.next-row');
        const again = document.createElement('button');
        again.className = 'btn ghost'; again.textContent = '🔁 Play it again (practice)';
        again.onclick = () => { document.onkeydown = null; start(); };
        r.insertBefore(again, r.firstChild);
      }
      loop();
    }
    start();
  };

  /* ---------------- results ---------------- */
  function showResults() {
    inLesson = false;
    const pct = R.max ? Math.round((R.score / R.max) * 100) : 100;
    const grade = gradeFor(pct), stars = starsFor(pct);
    const challenge = R.chTotal > 0 && R.chScore >= R.chTotal;
    const secs = Math.round((Date.now() - R.start) / 1000);
    const p = store.player();
    let newBest = false;
    if (p) {
      p.results = p.results || {};
      const r = p.results[R.L.id] || (p.results[R.L.id] = { attempts: 0, history: [] });
      r.attempts++;
      const entry = { date: new Date().toISOString(), pct, grade, stars, challenge, score: R.score, max: R.max, secs };
      r.history.push(entry);
      if (r.history.length > 30) r.history.shift();
      if (!r.best || pct > r.best.pct || (pct === r.best.pct && challenge && !r.best.challenge)) { r.best = entry; newBest = true; }
      else if (challenge && !r.best.challenge) { r.best.challenge = true; }
      store.save();
      syncProgress();
    }
    const mins = Math.floor(secs / 60), s2 = secs % 60;
    const review = R.missed.length ? `<div class="review"><h3>${OWL} Let’s remember these:</h3>${R.missed.map((m) =>
      `<div class="item"><div class="q">${fmt(m.q)}</div><div>Best answer: <b>${fmt(m.a)}</b></div></div>`).join('')}</div>` : '';
    render(`<div class="wrap"><div class="panel results">
      <h2>${R.L.icon} ${fmt(R.L.title)} — Complete!</h2>
      <div class="big-grade ${gradeCls(grade)}">${grade}</div>
      ${starsHTML(stars)}
      <div class="rank">${RANKNAME[grade]}</div>
      <div class="line">You scored <b>${fmtNum(R.score)}</b> out of <b>${R.max}</b> (${pct}%)</div>
      <div class="line">Best streak: 🔥 ${R.bestStreak} &nbsp;·&nbsp; Time: ${mins}m ${s2}s</div>
      ${R.chTotal ? `<div class="line" style="margin-top:8px">${challenge ? '🏆 <b>Challenge solved!</b> You earned the Challenge Trophy.' : '⭐ Challenge not solved this time — try it again for the trophy!'}</div>` : ''}
      ${newBest && p && p.results[R.L.id].attempts > 1 ? '<div class="line">🎊 New personal best!</div>' : ''}
      <div class="row" style="justify-content:center;margin-top:18px">
        <button class="btn" id="rs-again">🔁 Try again</button>
        <button class="btn green" id="rs-map">🗺️ Lesson map</button>
      </div>
      ${review}</div></div>`);
    document.getElementById('rs-again').onclick = () => startLesson(R.L.id);
    document.getElementById('rs-map').onclick = showMap;
    if (stars >= 2) { beep('win'); confetti(stars === 3 ? 60 : 30); }
  }

  /* ---------------- grown-ups ---------------- */
  function showGrownupGate() {
    const a = 6 + Math.floor(Math.random() * 6), b = 6 + Math.floor(Math.random() * 6);
    render(`<div class="wrap"><div class="panel" style="max-width:520px;margin:30px auto">
      <h2>👩‍🏫 Grown-ups only</h2><p>Please solve: <b>${a} × ${b} = ?</b></p>
      <div class="row"><input type="text" id="gg" style="max-width:140px" autocomplete="off"><button class="btn" id="gg-go">Enter</button><button class="btn ghost" id="gg-back">Back</button></div>
      <p class="muted" id="gg-msg"></p></div></div>`);
    const inp = document.getElementById('gg'); inp.focus();
    const go = () => { if (+inp.value === a * b) showGrownups(); else document.getElementById('gg-msg').textContent = 'Not quite — try again.'; };
    document.getElementById('gg-go').onclick = go;
    inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    document.getElementById('gg-back').onclick = () => (store.player() ? showMap() : showHome());
  }
  function showGrownups() {
    const built = COURSE.filter((c) => LESSONS[c.id]);
    const ps = store.data.players;
    const cells = (p) => built.map((c) => {
      const r = p.results && p.results[c.id];
      if (!r || !r.best) return '<td class="muted">—</td>';
      const last = (r.history && r.history[r.history.length - 1]) || r.best;
      return `<td title="${esc(p.name)} · ${esc((c.short || c.title).replace(/<[^>]+>/g, ''))}: best ${r.best.pct}% · ${r.attempts} attempt(s) · last ${last.pct}% on ${new Date(last.date).toLocaleDateString()}">
        <span class="mini-grade ${gradeCls(r.best.grade)}">${r.best.grade}</span> ${r.best.pct}%${r.best.challenge ? ' 🏆' : ''}<div class="muted" style="font-size:.8rem">${r.attempts}×</div></td>`;
    }).join('');
    const head = (extra, first = '') => `<tr><th>Player</th>${first}${built.map((c) => `<th>${c.icon}<br>${fmt(c.short || c.title)}</th>`).join('')}${extra}</tr>`;
    const wireTips = () => app.querySelectorAll('table.scores td[title]').forEach((td) => (td.onclick = () => { if (TOUCH) toast(esc(td.title)); }));
    const rows = ps.map((p) => `<tr><td class="nm">${p.avatar} ${esc(p.name)}</td>${cells(p)}<td><button class="btn ghost small" data-del="${p.id}">Delete</button></td></tr>`).join('');
    render(`<div class="wrap"><div class="panel">
      <h2>👩‍🏫 Scoreboard</h2>
      <p class="muted">Best grade for each player on this ${TOUCH ? 'device (tap a grade for details)' : 'computer (hover for details)'}. 🏆 = solved the challenge problem. Scores are saved in this browser only.</p>
      ${ps.length ? `<div style="overflow-x:auto"><table class="scores">${head('<th></th>')}${rows}</table></div>` : '<p>No players yet.</p>'}
      <div class="row" style="margin-top:18px">
        <button class="btn" id="gu-csv">⬇️ Download scores (CSV)</button>
        <button class="btn ghost" id="gu-back">Back</button>
      </div>
      ${SERVER ? `<h2 style="margin-top:26px">🌍 Everyone — all devices</h2>
        <p class="muted">Every player who has finished a lesson on any phone or computer, most recent first. It updates each time someone finishes a lesson.</p>
        <div id="gu-all"><p class="muted">Loading…</p></div>` : ''}
      </div></div>`);
    if (SERVER && window.fetch) {
      fetch(SERVER + '/api/progress').then((r) => r.json().then((d) => ({ ok: r.ok, d }))).then(({ ok, d }) => {
        const box = document.getElementById('gu-all'); if (!box) return;
        if (!ok) { box.innerHTML = `<div class="callout c-red">${esc((d && d.error) || 'The server had a problem.')}</div>`; return; }
        if (!d.players.length) { box.innerHTML = '<p>Nobody has finished a lesson yet.</p>'; return; }
        const done = (p) => built.filter((c) => p.results && p.results[c.id] && p.results[c.id].best).length;
        box.innerHTML = `<p><b>${d.players.length}</b> player${d.players.length > 1 ? 's' : ''}.</p>
          <div style="overflow-x:auto"><table class="scores">${head('<th>🎲<br>hands</th>', '<th>Lessons<br>done</th><th>Last<br>active</th>')}
          ${d.players.map((p) => `<tr><td class="nm">${esc(p.avatar || '')} ${esc(p.name)}</td><td style="white-space:nowrap"><b>${done(p)}</b> / ${built.length}</td><td style="white-space:nowrap">${new Date(p.updatedAt).toLocaleDateString()}</td>${cells(p)}<td>${(p.mini && p.mini.hands) || '—'}</td></tr>`).join('')}</table></div>`;
        wireTips();
      }).catch(() => { const box = document.getElementById('gu-all'); if (box) box.innerHTML = '<div class="callout c-red">Can’t reach the server right now. Check the internet connection and open this page again.</div>'; });
    }
    app.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => {
      const p = ps.find((x) => x.id === b.dataset.del);
      if (p) askConfirm(`Delete ${p.name} and all their scores?`, 'Delete', () => {
        store.data.players = ps.filter((x) => x !== p);
        if (store.data.currentId === p.id) store.data.currentId = null;
        store.save(); showGrownups();
      });
    }));
    wireTips();
    document.getElementById('gu-csv').onclick = downloadCSV;
    document.getElementById('gu-back').onclick = () => (store.player() ? showMap() : showHome());
  }
  function downloadCSV() {
    const lines = [['player', 'lesson', 'date', 'percent', 'grade', 'stars', 'challenge_solved', 'score', 'max', 'seconds'].join(',')];
    store.data.players.forEach((p) => Object.entries(p.results || {}).forEach(([lid, r]) => (r.history || []).forEach((h) => {
      const title = (COURSE.find((c) => c.id === lid) || { title: lid }).title.replace(/[♠♥♦♣]/g, (s) => ({ '♠': 'S', '♥': 'H', '♦': 'D', '♣': 'C' }[s]));
      lines.push([`"${p.name.replace(/"/g, '""')}"`, `"${title}"`, h.date, h.pct, h.grade, h.stars, h.challenge ? 'yes' : 'no', h.score, h.max, h.secs].join(','));
    })));
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bridge-quest-scores.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------------- boot ---------------- */
  store.load();
  // expose a few helpers for lesson files that want custom visuals
  window.BQ = { askConfirm, suitRows, handHTML, handBox, handTextHTML, cardHTML, auctionHTML, fmt, bidHTML, dealHTML, render, store, beep, toast, confetti, showMap, esc, SEATNAME,
    setBusy: (v) => { inLesson = v; } };
  // boot after every script (including Free Play) has loaded
  window.addEventListener('DOMContentLoaded', () => { if (store.player()) showMap(); else showHome(); });
})();

</script>
  <script>
/* Free Play: MiniBridge against the computer.
   The kid always sits South.  If North-South have more HCP the kid declares and plays BOTH North and South
   (and picks the contract after seeing dummy, like MiniBridge at camp).  Otherwise the kid defends with a computer partner. */
(function () {
  const P = window.Play, Q = window.BQ;
  const { fmt, cardHTML, bidHTML, store, beep, toast, confetti, esc } = Q;
  const SEATNAME = { N: 'North', E: 'East', S: 'South', W: 'West' };
  const SUITSYM = { S: '♠', H: '♥', D: '♦', C: '♣', N: 'NT' };
  const app = document.getElementById('app');
  const S = { dealer: 'N', session: { us: 0, them: 0, hands: 0 }, mode: 'mix', speed: 700 };
  let G = null;        // current hand

  function player() { return store.player(); }
  function saveStats(fn) {
    const p = player(); if (!p) return;
    p.mini = p.mini || { hands: 0, declared: 0, made: 0, defended: 0, beat: 0, us: 0, them: 0 };
    fn(p.mini); store.save();
  }
  const kidSeats = () => (G && G.side === 'NS' ? ['N', 'S'] : ['S']);
  const contractText = (c) => bidHTML(c.level + c.strain);

  /* ---------------- deal + announce ---------------- */
  function start() {
    Q.setBusy(false);
    let hands, m;
    do {
      hands = P.dealHands();
      m = P.miniSetup(hands, S.dealer);
      if (!m.redeal && S.mode === 'declare' && m.side === 'EW') {
        hands = { N: hands.E, E: hands.N, S: hands.W, W: hands.S };   // give our side the bigger cards
        m = P.miniSetup(hands, S.dealer);
      }
    } while (m.redeal);
    G = { hands, m, side: m.side, contract: null, st: null, hint: null };
    showAnnounce();
  }
  function header(extra) {
    const ss = S.session, dup = G && G.dup;
    return `<div class="lesson-head">
      <button class="chip-btn" id="mb-quit" title="${dup ? 'Leave this board' : 'Back to the map'}">✕</button>
      <div class="title">${dup ? `🏆 <span class="lbl-long">Duplicate · </span>Board ${dup.number}` : '🎲 <span class="lbl-long">Free Play: </span>MiniBridge'}</div>
      <div class="head-gap" style="flex:1"></div>
      ${dup ? `<div class="score-pill" title="Your username">👤 ${esc(dup.user)}</div>` : `<div class="score-pill" title="Points this session">You ${ss.us} · Them ${ss.them}</div>`}
      ${extra || ''}
    </div>`;
  }
  function wireQuit() {
    document.getElementById('mb-quit').onclick = () => {
      const dup = G && G.dup;
      const leave = () => { Q.setBusy(false); if (dup) dupHome(); else Q.showMap(); };
      if (G && G.st && G.st.history.length < 13) Q.askConfirm(dup ? 'Leave this board? You will get the same board again next time.' : 'Leave this hand?', 'Leave', leave);
      else if (dup && !G.done) Q.askConfirm('Leave this board? You will get the same board again next time.', 'Leave', leave);
      else leave();
    };
  }
  function handRow(seat, opts = {}) {
    const st = G.st;
    const cards = st ? st.hands[seat] : G.hands[seat];
    const legal = opts.legal || [];
    const groups = Q.suitRows(P.SUITS.map((s) => {
      const cs = P.inSuit(cards, s);
      return { n: cs.length, html: '<div class="grp">' + cs.map((c) => {
        if (!opts.clickable) return cardHTML(c[1], c[0]);
        const ok = legal.includes(c);
        return cardHTML(c[1], c[0], { button: true, extra: (ok ? 'playable' : 'dim') + (G.hint === c ? ' hint' : ''), disabled: !ok });
      }).join('') + '</div>' };
    }));
    return `<div class="hand">${groups || '<span style="color:#fff">—</span>'}</div>`;
  }
  function textHand(seat) {
    const cards = G.st ? G.st.hands[seat] : G.hands[seat];
    return '<div class="hand-text mb-text">' + P.SUITS.map((s) =>
      `<div><span class="s-${s}">${SUITSYM[s]}</span> ${P.inSuit(cards, s).map((c) => (c[1] === 'T' ? '10' : c[1])).join(' ') || '—'}</div>`).join('') + '</div>';
  }

  function showAnnounce() {
    const m = G.m, order = [], dup = G.dup, dealer = dup ? 'S' : S.dealer;
    let s = dealer; for (let i = 0; i < 4; i++) { order.push(s); s = P.nextSeat(s); }
    const ns = m.hcp.N + m.hcp.S, ew = m.hcp.E + m.hcp.W;
    const weDeclare = G.side === 'NS';
    Q.render(`<div class="wrap">${header()}
      <div class="panel">
        <h2>${dup ? `🏆 Board ${dup.number} — everyone plays these same cards` : `🃏 New hand — ${SEATNAME[dealer]} dealt`}</h2>
        <p>Everyone counts their HCP and says it out loud, starting with the dealer:</p>
        <div class="row" style="gap:10px;margin-bottom:10px">${order.map((x) => `<div class="call ${x === 'S' ? 'you' : ''}" style="padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line)"><div class="who">${SEATNAME[x]}${x === 'S' ? ' (you)' : x === 'N' ? ' (partner)' : ''}</div><div class="b">${m.hcp[x]} HCP</div></div>`).join('')}</div>
        <div class="callout ${weDeclare ? 'c-green' : 'blue'}">North-South have <b>${ns}</b> · East-West have <b>${ew}</b>.<br>
          ${weDeclare ? `🎉 Your side has more — <b>you are declaring!</b> ${SEATNAME[m.declarer]} has the most HCP, so ${SEATNAME[m.declarer]} is declarer and ${SEATNAME[m.dummy]} is dummy. You will play <b>both</b> hands.`
            : `East-West have more, so they declare: <b>${SEATNAME[m.declarer]}</b> is declarer. You and partner (North) are the <b>defenders</b> — try to set them!`}</div>
        <div class="hand-box"><div class="hand-label">Your hand (South) · ${m.hcp.S} HCP</div>${handRow('S')}</div>
        <div class="next-row" style="justify-content:space-between">
          <div class="row">${dup ? '<span class="muted">🚫🦉 No hints in duplicate — you are on your own!</span>' : `<label class="muted"><input type="checkbox" id="mb-declare" ${S.mode === 'declare' ? 'checked' : ''}> Give my side the stronger cards (declare every hand)</label>`}</div>
          <button class="btn green" id="mb-go">${weDeclare ? 'See dummy & choose the contract ▶' : 'Start the play ▶'}</button>
        </div>
      </div></div>`);
    wireQuit();
    const dc = document.getElementById('mb-declare');
    if (dc) dc.onchange = (e) => { S.mode = e.target.checked ? 'declare' : 'mix'; };
    document.getElementById('mb-go').onclick = () => (weDeclare ? showContract() : computerContract());
  }

  /* ---------------- contract ---------------- */
  function showContract() {
    const m = G.m;
    const sug = P.suggestContract(G.hands[m.declarer], G.hands[m.dummy]);
    let level = null, strain = null;
    const L = sug.lengths;
    Q.render(`<div class="wrap">${header()}
      <div class="panel">
        <h2>📝 You are declarer — choose the contract</h2>
        <div class="q-layout"><div class="left">
          <div class="hand-box" style="margin-bottom:8px"><div class="hand-label">North${m.dummy === 'N' ? ' · Dummy' : ' · Declarer'} · ${m.hcp.N} HCP</div>${handRow('N')}</div>
          <div class="hand-box"><div class="hand-label">South (you)${m.dummy === 'S' ? ' · Dummy' : ' · Declarer'} · ${m.hcp.S} HCP</div>${handRow('S')}</div>
        </div><div class="right" style="max-width:340px">
          <div class="callout">Together: <b>${sug.hcp} HCP</b><br>Cards together: ${P.SUITS.map((s) => `<b class="s-${s}">${SUITSYM[s]}</b> ${L[s]}`).join(' &nbsp;')}</div>
          <p style="margin:6px 0"><b>Where?</b> (8+ cards = a fit. Majors → Notrump → Minors)</p>
          <div class="row" id="mb-strain">${['C', 'D', 'H', 'S', 'N'].map((s) => `<button class="btn ghost small" data-s="${s}">${s === 'N' ? 'NT' : `<span class="s-${s}">${SUITSYM[s]}</span>`}</button>`).join('')}</div>
          <p style="margin:10px 0 6px"><b>How high?</b> (game: 3NT · 4♥/4♠ · 5♣/5♦)</p>
          <div class="row" id="mb-level">${[1, 2, 3, 4, 5, 6, 7].map((l) => `<button class="btn ghost small" data-l="${l}">${l}</button>`).join('')}</div>
          <p id="mb-pick" class="big" style="margin:12px 0 4px">Contract: —</p>
          <div id="mb-advice"></div>
          <div class="row" style="margin-top:10px">${G.dup ? '' : '<button class="btn small" id="mb-owl">🦉 Owl’s advice</button>'}<button class="btn green" id="mb-play" disabled>Play it! ▶</button></div>
        </div></div></div></div>`);
    wireQuit();
    const upd = () => {
      document.querySelectorAll('#mb-strain button').forEach((b) => b.classList.toggle('sel', b.dataset.s === strain));
      document.querySelectorAll('#mb-level button').forEach((b) => b.classList.toggle('sel', +b.dataset.l === level));
      document.getElementById('mb-pick').innerHTML = `Contract: ${level && strain ? bidHTML(level + strain) + ` &nbsp;<span class="muted" style="font-size:1rem">(${level + 6} tricks)</span>` : '—'}`;
      document.getElementById('mb-play').disabled = !(level && strain);
    };
    document.querySelectorAll('#mb-strain button').forEach((b) => (b.onclick = () => { strain = b.dataset.s; upd(); }));
    document.querySelectorAll('#mb-level button').forEach((b) => (b.onclick = () => { level = +b.dataset.l; upd(); }));
    const owl = document.getElementById('mb-owl');
    if (owl) owl.onclick = () => {
      document.getElementById('mb-advice').innerHTML = `<div class="callout blue">🦉 I would play <b>${bidHTML(sug.level + sug.strain)}</b>. ${fmt(sug.why)}</div>`;
      level = sug.level; strain = sug.strain; upd();
    };
    document.getElementById('mb-play').onclick = () => beginPlay({ level, strain });
  }
  function computerContract() {
    const m = G.m;
    const sug = P.suggestContract(G.hands[m.declarer], G.hands[m.dummy]);
    toast(`${SEATNAME[m.declarer]} chooses ${sug.level}${sug.strain === 'N' ? 'NT' : SUITSYM[sug.strain]}`);
    beginPlay({ level: sug.level, strain: sug.strain });
  }

  /* ---------------- play ---------------- */
  function beginPlay(contract) {
    G.contract = contract;
    G.st = P.newPlay(G.hands, contract, G.m.declarer);
    G.lastTrick = null;
    Q.setBusy(true);
    window.scrollTo(0, 0);
    loop();
  }
  function drawTable(msg) {
    const st = G.st, m = G.m;
    const turn = st.history.length < 13 ? P.turnOf(st) : null;
    const mine = turn && kidSeats().includes(turn) && !G.pause;
    const legal = mine ? P.legalCards(st, turn) : [];
    const showN = G.side === 'NS' || (st.dummyVisible && m.dummy === 'N');
    const seatBox = (seat) => {
      const role = seat === m.declarer ? 'Declarer' : seat === m.dummy ? 'Dummy' : 'Defender';
      const lbl = `<div class="hand-label">${SEATNAME[seat]}${seat === 'S' ? ' (you)' : seat === 'N' && G.side === 'EW' ? ' (partner)' : ''} · ${role}${turn === seat ? ' <span class="led">turn</span>' : ''}</div>`;
      if (seat === 'N' || seat === 'S') {
        const vis = seat === 'S' || showN;
        const click = kidSeats().includes(seat) && turn === seat;
        return `<div class="mb-seat mb-${seat} ${turn === seat && mine ? 'turn' : ''}">${lbl}${vis ? handRow(seat, { clickable: click, legal }) : `<div class="mb-backs">🂠 × ${st.hands[seat].length}</div>`}</div>`;
      }
      const vis = st.dummyVisible && seat === m.dummy;
      return `<div class="mb-seat mb-${seat}">${lbl}${vis ? textHand(seat) : `<div class="mb-backs">🂠 × ${st.hands[seat].length}</div>`}</div>`;
    };
    const t = st.trick.length ? st.trick : (G.lastTrick || []);
    const bySeat = {}; t.forEach((x) => (bySeat[x.seat] = x.card));
    const spot = (s) => `<div class="spot spot-${s}">${bySeat[s] ? cardHTML(bySeat[s][1], bySeat[s][0]) : '<div class="card empty"></div>'}</div>`;
    const need = G.contract.level + 6;
    // the previous (finished) trick, shown small in the corner
    const prev = st.history[st.history.length - (G.pause ? 2 : 1)] || null;   // while the finished trick is still in the middle, the corner shows the one before
    let lastBox = () => '';
    if (prev) {
      const ps = {}; prev.cards.forEach((x) => (ps[x.seat] = x.card));
      const sp = (s) => `<div class="spot spot-${s} ${prev.winner === s ? 'won' : ''}">${cardHTML(ps[s][1], ps[s][0], { small: true })}${prev.cards[0].seat === s ? '<div class="led-dot">led</div>' : ''}</div>`;
      // drawn twice: in the top bar on wide screens, under the table on phones — never over a hand
      lastBox = (where) => `<div class="mb-last ${where}"><div class="mb-last-t">Last trick · ${SEATNAME[prev.winner]} won</div>
        <div class="trick-table mb-last-tt">${sp('N')}${sp('W')}<div class="spot-mid">#${st.history.length}</div>${sp('E')}${sp('S')}</div></div>`;
    }
    const ourSide = G.side === 'NS';
    const declTricks = st.tricks[G.side];
    Q.render(`<div class="wrap">${header(`<button class="chip-btn" id="mb-speed" title="Computer speed">${S.speed < 500 ? '⏩<span class="lbl"> Fast</span>' : '▶<span class="lbl"> Normal</span>'}</button>`)}
      <div class="panel mb-panel">
        <div class="mb-top">
          <div class="contract-badge">Contract: <b>${contractText(G.contract)}</b> by ${SEATNAME[m.declarer]}</div>
          <div class="mb-count">Declarer ${declTricks} / ${need} needed &nbsp;·&nbsp; Defenders ${st.tricks[G.side === 'NS' ? 'EW' : 'NS']}</div>
          ${lastBox('top')}
          ${mine && !G.dup ? '<button class="btn small" id="mb-hint">🦉 Hint</button>' : ''}
        </div>
        <div class="mb-table">
          ${lastBox('bot')}
          ${seatBox('N')}${seatBox('W')}
          <div class="mb-mid"><div class="trick-table mb-trick">${spot('N')}${spot('W')}<div class="spot-mid">${G.contract.strain === 'N' ? '<b>NT</b>' : `Trump <b class="s-${G.contract.strain}">${SUITSYM[G.contract.strain]}</b>`}</div>${spot('E')}${spot('S')}</div>
            <div class="mb-msg">${fmt(msg || (mine ? `Your turn — play a card from <b>${SEATNAME[turn]}</b>${turn === m.dummy ? ' (dummy)' : ''}.` : turn ? `${SEATNAME[turn]} is thinking…` : ''))}</div></div>
          ${seatBox('E')}${seatBox('S')}
        </div>
      </div></div>`, { keepScroll: true });
    wireQuit();
    document.getElementById('mb-speed').onclick = () => { S.speed = S.speed < 500 ? 700 : 250; drawTable(msg); };
    const hb = document.getElementById('mb-hint');
    if (hb) hb.onclick = () => { G.hint = P.botPlay(st, turn); drawTable(`🦉 I would play the ${fmt(SUITSYM[G.hint[0]] + (G.hint[1] === 'T' ? '10' : G.hint[1]))}.`); };
    document.querySelectorAll('.mb-seat button.card.playable').forEach((b) => (b.onclick = () => kidPlay(turn, b.dataset.card)));
    void ourSide;
  }
  function kidPlay(seat, card) {
    if (G.pause || P.turnOf(G.st) !== seat) return;
    G.hint = null;
    afterPlay(seat, card);
  }
  function afterPlay(seat, card) {
    const st = G.st;
    const before = st.trick.slice();
    const w = P.playCard(st, seat, card);
    if (w) {
      G.lastTrick = [...before, { seat, card }];
      const ours = P.sideOf(w) === 'NS';
      if (ours) beep('good');
      G.pause = true;
      drawTable(`${ours ? '✅' : '❌'} ${SEATNAME[w]} wins the trick.`);
      setTimeout(() => { G.pause = false; G.lastTrick = null; loop(); }, Math.max(900, S.speed * 1.6));
    } else loop();
  }
  function loop() {
    const st = G.st;
    if (st.history.length === 13) return finish();
    const seat = P.turnOf(st);
    if (kidSeats().includes(seat)) return drawTable();
    drawTable();
    const gen = G.gen = (G.gen || 0) + 1;
    setTimeout(() => { if (G.st === st && G.gen === gen && P.turnOf(st) === seat) afterPlay(seat, P.botPlay(st, seat)); }, S.speed);
  }

  /* ---------------- result ---------------- */
  function finish() {
    Q.setBusy(false);
    if (G.dup) return dupFinish();
    const st = G.st, m = G.m, c = G.contract;
    const tricks = st.tricks[G.side];
    const sc = P.miniScore(c, tricks);
    const weDeclared = G.side === 'NS';
    const us = weDeclared ? sc.declarer : sc.defenders, them = weDeclared ? sc.defenders : sc.declarer;
    S.session.us += us; S.session.them += them; S.session.hands++;
    saveStats((x) => {
      x.hands++; x.us += us; x.them += them;
      if (weDeclared) { x.declared++; if (sc.made) x.made++; } else { x.defended++; if (!sc.made) x.beat++; }
    });
    const good = weDeclared ? sc.made : !sc.made;
    const headline = weDeclared
      ? (sc.made ? `🎉 You made ${contractText(c)}${sc.over ? ` with ${sc.over} overtrick${sc.over > 1 ? 's' : ''}` : ''}!` : `😬 Down ${sc.down} — you took ${tricks} of ${c.level + 6} tricks.`)
      : (sc.made ? `${SEATNAME[m.declarer]} made ${contractText(c)}.` : `🛡️ You set them! ${SEATNAME[m.declarer]} went down ${sc.down}.`);
    const detail = sc.made
      ? `Trick points ${sc.trickPoints} + ${sc.game ? 'game bonus 300' : 'part-score bonus 50'} = <b>${sc.declarer}</b> for ${weDeclared ? 'you' : 'them'}.`
      : `${sc.down} trick${sc.down > 1 ? 's' : ''} short × 50 = <b>${sc.defenders}</b> set points for ${weDeclared ? 'them' : 'you'}.`;
    S.dealer = P.nextSeat(S.dealer);
    const p = player(), mm = p && p.mini;
    Q.render(`<div class="wrap">${header()}
      <div class="panel results">
        <h2>${headline}</h2>
        <div class="line">${detail}</div>
        <div class="line">This session: You <b>${S.session.us}</b> · Them <b>${S.session.them}</b> (${S.session.hands} hand${S.session.hands > 1 ? 's' : ''})</div>
        ${mm ? `<div class="line muted">All-time: declared ${mm.declared} (made ${mm.made}) · defended ${mm.defended} (set them ${mm.beat})</div>` : ''}
        <div class="row" style="justify-content:center;margin:16px 0"><button class="btn green" id="mb-next">🃏 Next hand ▶</button><button class="btn ghost" id="mb-map">🗺️ Lesson map</button></div>
        <div class="q-kicker">👀 All four hands</div>
        <div style="display:flex;justify-content:center">${Q.dealHTML(Object.fromEntries(P.SEATS.map((s) => [s, P.handString(st.start[s])])), { you: 'S', contract: c.level + c.strain, declarer: m.declarer })}</div>
      </div></div>`);
    wireQuit();
    document.getElementById('mb-next').onclick = start;
    document.getElementById('mb-map').onclick = Q.showMap;
    if (good) { beep('win'); confetti(30); }
  }

  /* =====================================================================================================
     DUPLICATE MiniBridge — everyone plays the same deals (kept on the server) and results are matchpointed.
     The server address is the one line  window.BQ_SERVER = '…'  in index.html.  No hints in this mode.
     ===================================================================================================== */
  const SERVER = String(window.BQ_SERVER || '').replace(/\/+$/, '');
  const USER_RE = /^[A-Za-z0-9]{1,20}$/;
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: just don't remember */ } },
  };
  async function api(path, body) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    let r;
    try {
      r = await fetch(SERVER + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal } : { signal: ctl.signal });
    } catch (e) { const err = new Error('Can’t reach the duplicate server. Check your internet connection and try again.'); err.offline = true; throw err; }
    finally { clearTimeout(timer); }
    let data = null; try { data = await r.json(); } catch (e) { /* not JSON */ }
    if (!r.ok) throw new Error((data && data.error) || `The duplicate server had a problem (${r.status}).`);
    return data;
  }
  const dupUser = () => ls.get('bq.dupUser', '');
  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const pctText = (p) => (p === null || p === undefined ? '—' : `${p}%`);
  function resultWord(contract, tricks) {
    const d = tricks - (+contract[0] + 6);
    return d === 0 ? 'made' : d > 0 ? `made +${d}` : `down ${-d}`;
  }
  function dupHead(title) {
    return `<div class="lesson-head"><button class="chip-btn" id="dup-back" title="Back">✕</button><div class="title">🏆 ${title}</div></div>`;
  }
  const dupError = (e) => `<div class="callout c-red">${esc(e.message || String(e))}</div>`;
  const dupButtons = (skip) => `<div class="row dup-btns">
      ${skip === 'next' ? '' : '<button class="btn green" id="dup-next">▶ Play a board</button>'}
      ${skip === 'mine' ? '' : '<button class="btn ghost" id="dup-mine">📋 My results</button>'}
      ${skip === 'leaders' ? '' : '<button class="btn ghost" id="dup-leaders">🏅 Leaderboard</button>'}
    </div>`;
  function wireDup(back) {
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('dup-back', back || dupHome); on('dup-next', dupNext); on('dup-mine', dupMine); on('dup-leaders', dupLeaders);
  }
  // results that could not be sent (no connection) wait on this device and are sent the next time
  async function flushPending() {
    const waiting = ls.get('bq.dupPending', []);
    if (!waiting.length) return;
    const still = [];
    for (const w of waiting) { try { await api('/api/result', w); } catch (e) { if (e.offline) still.push(w); } }
    ls.set('bq.dupPending', still);
  }

  function dupHome(note) {
    Q.setBusy(false); G = null;
    const p = player();
    const guess = dupUser() || ((p && p.name) || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 20);
    Q.render(`<div class="wrap">${dupHead('Duplicate MiniBridge')}
      <div class="panel">
        <h2>Play the same deals as everyone else!</h2>
        <p>Every player gets the <b>same cards</b>. You always declare with the best hand. When you finish a board, you see how your score compares with everyone who played it — and your score keeps updating as more people play.</p>
        <div class="callout">🚫🦉 <b>No hints</b> here. (Hints are still in Free Play.)</div>
        <p style="margin:12px 0 4px"><b>Your username</b> <span class="muted">— letters and numbers only</span></p>
        <input type="text" id="dup-user" maxlength="20" value="${esc(guess)}" placeholder="Username" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
        <div id="dup-msg">${note || ''}</div>
        ${dupButtons()}
        <div id="dup-sum" class="muted" style="margin-top:10px"></div>
      </div></div>`);
    wireDup(Q.showMap);
    const inp = document.getElementById('dup-user');
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); dupNext(); } };
    flushPending().then(() => {
      const u = dupUser(); if (!u || !document.getElementById('dup-sum')) return;
      api('/api/player/' + encodeURIComponent(u)).then((d) => {
        const el = document.getElementById('dup-sum'); if (!el || !d.summary.boards) return;
        el.innerHTML = `${esc(d.user)}: <b>${d.summary.boards}</b> board${d.summary.boards > 1 ? 's' : ''} played${d.summary.pct === null ? '' : ` · matchpoints <b>${d.summary.pct}%</b>`}`;
      }).catch(() => {});
    });
  }
  // read the username box if it is on screen; otherwise use the remembered name
  function needUser() {
    const inp = document.getElementById('dup-user');
    const u = inp ? inp.value.trim() : dupUser();
    if (!USER_RE.test(u)) {
      const msg = '<div class="callout c-red">Type a username first: 1 to 20 letters and numbers, no spaces.</div>';
      if (inp) { document.getElementById('dup-msg').innerHTML = msg; inp.focus(); } else dupHome(msg);
      return null;
    }
    ls.set('bq.dupUser', u);
    return u;
  }
  async function dupNext() {
    const user = needUser(); if (!user) return;
    Q.render(`<div class="wrap">${dupHead('Duplicate MiniBridge')}<div class="panel"><p class="big">🃏 Dealing your next board…</p></div></div>`); wireDup();
    try {
      const d = await api('/api/next', { user });
      const hands = {}; P.SEATS.forEach((s) => (hands[s] = P.sortHand(d.board.hands[s])));
      const m = P.miniSetup(hands, 'S');
      if (m.redeal || m.side !== 'NS') throw new Error('This board is not set up for MiniBridge. Please tell your teacher (board ' + d.board.number + ').');
      G = { hands, m, side: 'NS', contract: null, st: null, hint: null, dup: { id: d.board.id, number: d.board.number, user, plays: d.board.plays } };
      showAnnounce();
    } catch (e) { dupHome(dupError(e)); }
  }
  async function dupFinish() {
    const st = G.st, c = G.contract, dup = G.dup, tricks = st.tricks.NS;
    G.done = true;
    const sc = P.miniScore(c, tricks);
    const payload = { user: dup.user, boardId: dup.id, contract: c.level + c.strain, tricks };
    const headline = sc.made ? `🎉 You made ${contractText(c)}${sc.over ? ` with ${sc.over} overtrick${sc.over > 1 ? 's' : ''}` : ''}!` : `😬 Down ${sc.down} — you took ${tricks} of ${c.level + 6} tricks.`;
    Q.render(`<div class="wrap">${dupHead('Board ' + dup.number)}<div class="panel results"><h2>${headline}</h2><p class="big">📨 Sending your result…</p></div></div>`); wireDup();
    if (sc.made) { beep('win'); confetti(30); }
    try {
      const view = await api('/api/result', payload);
      showBoard(view, { headline, saved: view.saved });
    } catch (e) {
      if (e.offline) ls.set('bq.dupPending', ls.get('bq.dupPending', []).concat([payload]));
      Q.render(`<div class="wrap">${dupHead('Board ' + dup.number)}<div class="panel results"><h2>${headline}</h2>
        ${dupError(e)}${e.offline ? '<p>Your result is <b>saved on this device</b> and will be sent the next time you open Duplicate.</p>' : ''}
        ${dupButtons()}</div></div>`); wireDup();
    }
  }
  function resultsTable(results) {
    return `<div style="overflow-x:auto"><table class="scores dup-table"><tr><th>#</th><th style="text-align:left">Player</th><th>Contract</th><th>Tricks</th><th>Score</th><th>MP %</th></tr>
      ${results.map((r) => `<tr class="${r.you ? 'me' : ''}"><td>${r.rank}</td><td style="text-align:left">${esc(r.user)}${r.you ? ' (you)' : ''}</td><td>${bidHTML(r.contract)}</td><td>${r.tricks}</td><td>${r.score}</td><td>${pctText(r.pct)}</td></tr>`).join('')}</table></div>`;
  }
  function showBoard(view, opts = {}) {
    const y = view.you, b = view.board, n = view.results.length;
    const handsStr = Object.fromEntries(P.SEATS.map((s) => [s, P.handString(P.sortHand(b.hands[s]))]));
    Q.render(`<div class="wrap">${dupHead('Board ' + b.number)}
      <div class="panel results">
        <h2>${opts.headline || `Board ${b.number}: ${bidHTML(y.contract)} ${resultWord(y.contract, y.tricks)}`}</h2>
        <div class="line">Your score: <b>${y.score}</b></div>
        ${opts.saved === false ? '<div class="callout blue">You had already played this board, so your <b>first</b> result is the one that counts.</div>' : ''}
        ${y.pct === null
          ? '<div class="callout">You are the <b>first</b> to play this board! Come back later to see how you compare.</div>'
          : `<div class="dup-big">${y.pct}%</div><div class="line"><b>${ordinal(y.rank)}</b> of ${n} players on this board</div>`}
        ${resultsTable(view.results)}
        ${view.summary && view.summary.pct !== null ? `<div class="line" style="margin-top:10px">Your running total: <b>${view.summary.pct}%</b> over ${view.summary.compared} board${view.summary.compared > 1 ? 's' : ''}</div>` : ''}
        ${dupButtons()}
        <div class="q-kicker" style="margin-top:14px">👀 All four hands</div>
        <div style="display:flex;justify-content:center">${Q.dealHTML(handsStr, { you: 'S', contract: y.contract, declarer: 'S' })}</div>
      </div></div>`);
    wireDup(opts.back);
  }
  async function dupMine() {
    const user = needUser(); if (!user) return;
    Q.render(`<div class="wrap">${dupHead('My results')}<div class="panel"><p class="big">Loading…</p></div></div>`); wireDup();
    try {
      await flushPending();
      const d = await api('/api/player/' + encodeURIComponent(user)), s = d.summary;
      Q.render(`<div class="wrap">${dupHead('My results')}
        <div class="panel">
          <h2>📋 ${esc(d.user)}</h2>
          ${!s.boards ? '<p>No boards played yet. Play one!</p>' : `
          <div class="callout c-green">Boards played: <b>${s.boards}</b>${s.pct === null ? ' · no one else has played your boards yet' : ` · Matchpoints: <b>${s.mp}</b> of ${s.top} = <b>${s.pct}%</b>`}</div>
          <p class="muted" style="margin:4px 0">Tap a board to see everyone’s results. Your percentages change as more people play.</p>
          <div style="overflow-x:auto"><table class="scores dup-table dup-pick"><tr><th>Board</th><th>Contract</th><th>Result</th><th>Score</th><th>Players</th><th>MP %</th></tr>
            ${d.boards.map((b) => `<tr data-id="${b.id}"><td><b>${b.number}</b></td><td>${bidHTML(b.contract)}</td><td>${resultWord(b.contract, b.tricks)}</td><td>${b.score}</td><td>${b.players}</td><td>${b.pct === null ? '—' : `${b.pct}% <span class="muted">(${ordinal(b.rank)})</span>`}</td></tr>`).join('')}</table></div>`}
          ${dupButtons('mine')}
        </div></div>`);
      wireDup();
      document.querySelectorAll('.dup-pick tr[data-id]').forEach((tr) => (tr.onclick = async () => {
        try { showBoard(await api(`/api/board/${tr.dataset.id}?user=${encodeURIComponent(user)}`), { back: dupMine }); } catch (e) { dupHome(dupError(e)); }
      }));
    } catch (e) { dupHome(dupError(e)); }
  }
  async function dupLeaders() {
    Q.render(`<div class="wrap">${dupHead('Leaderboard')}<div class="panel"><p class="big">Loading…</p></div></div>`); wireDup();
    try {
      const d = await api('/api/leaderboard'), me = dupUser().toLowerCase();
      Q.render(`<div class="wrap">${dupHead('Leaderboard')}
        <div class="panel">
          <h2>🏅 Leaderboard</h2>
          ${!d.players.length ? '<p>Nobody has played yet. Be the first!</p>' : `
          <p class="muted" style="margin:4px 0">${d.boards} board${d.boards > 1 ? 's' : ''} in play. The percentage is matchpoints won out of matchpoints possible.</p>
          <div style="overflow-x:auto"><table class="scores dup-table"><tr><th>#</th><th style="text-align:left">Player</th><th>Boards</th><th>MP %</th></tr>
            ${d.players.map((p, i) => `<tr class="${p.user.toLowerCase() === me ? 'me' : ''}"><td>${p.pct === null ? '—' : i + 1}</td><td style="text-align:left">${esc(p.user)}${p.user.toLowerCase() === me ? ' (you)' : ''}</td><td>${p.boards}</td><td>${pctText(p.pct)}</td></tr>`).join('')}</table></div>`}
          ${dupButtons('leaders')}
        </div></div>`);
      wireDup();
    } catch (e) { dupHome(dupError(e)); }
  }

  window.BQ_MINI = { start, duplicate: dupHome, hasDuplicate: !!SERVER };
})();

</script>
</body>
</html>
